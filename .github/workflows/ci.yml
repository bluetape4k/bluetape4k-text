name: CI

permissions:
  contents: read
  pull-requests: read
  actions: read
  checks: read
  statuses: read
  packages: read

on:
  workflow_dispatch:
  push:
    branches: [develop, main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - '.gitleaks.toml'
      - 'CHANGELOG.md'
      - 'LICENSE'
  pull_request:
    branches: [develop, main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - '.gitleaks.toml'
      - 'CHANGELOG.md'
      - 'LICENSE'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '21'
  JAVA_DISTRIBUTION: 'temurin'
  GITLEAKS_VERSION: '8.30.1'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  BLUETAPE4K_DEPENDENCIES_CATALOG_REF: 'b6667cfab4a316ad4fa51eeb1a0c1ed2dddc4749'

jobs:
  gitleaks:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/
      - name: Run gitleaks
        run: gitleaks detect --source . --redact --no-git --config .gitleaks.toml

  validate-wrapper:
    name: Validate Gradle Wrapper
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: gradle/actions/wrapper-validation@v6

  changes:
    name: Detect changed modules
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tokenizer-core: ${{ steps.filter.outputs.tokenizer-core }}
      tokenizer-japanese: ${{ steps.filter.outputs.tokenizer-japanese }}
      tokenizer-korean: ${{ steps.filter.outputs.tokenizer-korean }}
      lingua: ${{ steps.filter.outputs.lingua }}
      text-search: ${{ steps.filter.outputs.text-search }}
      examples: ${{ steps.filter.outputs.examples }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            tokenizer-core:
              - 'tokenizer-core/**'
              - '.github/workflows/ci.yml'
              - '.github/scripts/**'
            tokenizer-japanese:
              - 'tokenizer-japanese/**'
              - '.github/workflows/ci.yml'
              - '.github/scripts/**'
            tokenizer-korean:
              - 'tokenizer-korean/**'
              - '.github/workflows/ci.yml'
              - '.github/scripts/**'
            lingua:
              - 'lingua/**'
              - '.github/workflows/ci.yml'
              - '.github/scripts/**'
            text-search:
              - 'text-search/**'
              - '.github/workflows/ci.yml'
              - '.github/scripts/**'
            examples:
              - 'examples/**'
              - 'settings.gradle.kts'
              - 'build.gradle.kts'
              - 'gradle/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/nightly-tests.yml'
              - 'text-search/**'
              - 'lingua/**'
              - 'tokenizer-core/**'
              - 'tokenizer-korean/**'
              - 'tokenizer-japanese/**'

  catalog-governance:
    name: Central Catalog Governance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: bluetape4k/bluetape4k-dependencies
          ref: ${{ env.BLUETAPE4K_DEPENDENCIES_CATALOG_REF }}
          path: .catalog/bluetape4k-dependencies
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Verify immutable catalog checkout
        run: test "$(git -C .catalog/bluetape4k-dependencies rev-parse HEAD)" = "$BLUETAPE4K_DEPENDENCIES_CATALOG_REF"
      - name: Check central catalog adoption
        run: |
          python3 .catalog/bluetape4k-dependencies/scripts/sync-shared-versions.py \
            --workspace "$(dirname "$GITHUB_WORKSPACE")" \
            --repo "${GITHUB_REPOSITORY#*/}" \
            --check \
            --summary
      - name: Resolve Gradle catalog from checked-out source
        env:
          BLUETAPE4K_DEPENDENCIES_CATALOG_PATH: ${{ github.workspace }}/.catalog/bluetape4k-dependencies/gradle/libs.versions.toml
        run: ./gradlew help --no-daemon

  build:
    name: Build (compile only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [validate-wrapper, catalog-governance]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Build (compile only)
        run: |
          for attempt in 1 2 3 4 5; do
            ./gradlew build -x test --parallel && break
            echo "Attempt $attempt failed"
            [ $attempt -lt 5 ] && sleep 30 || exit 1
          done
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"

  test-tokenizer-core:
    name: Test / tokenizer-core
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build, changes]
    if: ${{ needs.changes.outputs['tokenizer-core'] == 'true' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper
          cache-read-only: true
      - name: Test tokenizer-core
        run: |
          for attempt in 1 2 3 4 5; do
            ./gradlew :tokenizer-core:test --no-daemon && break
            echo "Attempt $attempt failed"
            [ $attempt -lt 5 ] && sleep 30 || exit 1
          done
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"
      - name: Generate Kover XML report
        if: always()
        run: ./gradlew :tokenizer-core:koverXmlReport --no-daemon
        continue-on-error: true

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-tokenizer-core
          path: '**/build/reports/kover/'
          retention-days: 7

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-tokenizer-core
          path: '**/build/test-results/test/*.xml'
          retention-days: 7

  test-tokenizer-japanese:
    name: Test / tokenizer-japanese
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build, changes]
    if: ${{ needs.changes.outputs['tokenizer-japanese'] == 'true' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper
          cache-read-only: true
      - name: Test tokenizer-japanese
        run: |
          for attempt in 1 2 3 4 5; do
            ./gradlew :tokenizer-japanese:test --no-daemon && break
            echo "Attempt $attempt failed"
            [ $attempt -lt 5 ] && sleep 30 || exit 1
          done
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"
      - name: Generate Kover XML report
        if: always()
        run: ./gradlew :tokenizer-japanese:koverXmlReport --no-daemon
        continue-on-error: true

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-tokenizer-japanese
          path: '**/build/reports/kover/'
          retention-days: 7

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-tokenizer-japanese
          path: '**/build/test-results/test/*.xml'
          retention-days: 7

  test-tokenizer-korean:
    name: Test / tokenizer-korean
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build, changes]
    if: ${{ needs.changes.outputs['tokenizer-korean'] == 'true' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper
          cache-read-only: true
      - name: Test tokenizer-korean
        run: |
          for attempt in 1 2 3 4 5; do
            ./gradlew :tokenizer-korean:test --no-daemon && break
            echo "Attempt $attempt failed"
            [ $attempt -lt 5 ] && sleep 30 || exit 1
          done
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"
      - name: Generate Kover XML report
        if: always()
        run: ./gradlew :tokenizer-korean:koverXmlReport --no-daemon
        continue-on-error: true

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-tokenizer-korean
          path: '**/build/reports/kover/'
          retention-days: 7

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-tokenizer-korean
          path: '**/build/test-results/test/*.xml'
          retention-days: 7

  test-lingua:
    name: Test / lingua
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build, changes]
    if: ${{ needs.changes.outputs['lingua'] == 'true' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper
          cache-read-only: true
      - name: Test lingua
        run: |
          for attempt in 1 2 3 4 5; do
            ./gradlew :lingua:test --no-daemon && break
            echo "Attempt $attempt failed"
            [ $attempt -lt 5 ] && sleep 30 || exit 1
          done
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"
      - name: Generate Kover XML report
        if: always()
        run: ./gradlew :lingua:koverXmlReport --no-daemon
        continue-on-error: true

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-lingua
          path: '**/build/reports/kover/'
          retention-days: 7

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-lingua
          path: '**/build/test-results/test/*.xml'
          retention-days: 7

  test-text-search:
    name: Test / text-search
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build, changes]
    if: ${{ needs.changes.outputs['text-search'] == 'true' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper
          cache-read-only: true
      - name: Test text-search
        run: |
          for attempt in 1 2 3 4 5; do
            ./gradlew :text-search:test --no-daemon && break
            echo "Attempt $attempt failed"
            [ $attempt -lt 5 ] && sleep 30 || exit 1
          done
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"
      - name: Generate Kover XML report
        if: always()
        run: ./gradlew :text-search:koverXmlReport --no-daemon
        continue-on-error: true

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-text-search
          path: '**/build/reports/kover/'
          retention-days: 7

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-text-search
          path: '**/build/test-results/test/*.xml'
          retention-days: 7

  test-examples:
    name: Test / examples
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build, changes]
    if: ${{ needs.changes.outputs['examples'] == 'true' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper
          cache-read-only: true
      - name: Test and run examples
        run: |
          for attempt in 1 2 3 4 5; do
            ./gradlew :examples:text-search-examples:test :examples:lingua-examples:test :examples:tokenizer-safety-examples:test :examples:text-search-examples:run :examples:lingua-examples:run :examples:tokenizer-safety-examples:run --no-daemon && break
            echo "Attempt $attempt failed"
            [ $attempt -lt 5 ] && sleep 30 || exit 1
          done
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-examples
          path: '**/build/test-results/test/*.xml'
          retention-days: 7

  coverage-report:
    name: Coverage Report
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - changes
      - test-tokenizer-core
      - test-tokenizer-japanese
      - test-tokenizer-korean
      - test-lingua
      - test-text-search
    if: >
      always() && (
        needs.changes.outputs.tokenizer-core == 'true' ||
        needs.changes.outputs.tokenizer-japanese == 'true' ||
        needs.changes.outputs.tokenizer-korean == 'true' ||
        needs.changes.outputs.lingua == 'true' ||
        needs.changes.outputs.text-search == 'true'
      )
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Download all coverage artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          path: coverage-artifacts
          merge-multiple: false
        continue-on-error: true

      - name: Validate coverage artifacts
        shell: bash
        run: |
          set -euo pipefail

          expected_artifacts=(
            coverage-tokenizer-core
            coverage-tokenizer-japanese
            coverage-tokenizer-korean
            coverage-lingua
            coverage-text-search
          )

          missing_artifacts=()
          empty_artifacts=()

          for artifact in "${expected_artifacts[@]}"; do
            artifact_dir="coverage-artifacts/${artifact}"
            if [[ ! -d "${artifact_dir}" ]]; then
              missing_artifacts+=("${artifact}")
              continue
            fi

            if ! find "${artifact_dir}" -type f \( -name 'report.xml' -o -name 'reportJvm.xml' \) -print -quit | grep -q .; then
              empty_artifacts+=("${artifact}")
            fi
          done

          if (( ${#missing_artifacts[@]} > 0 || ${#empty_artifacts[@]} > 0 )); then
            echo "::error title=Coverage artifacts incomplete::Expected coverage artifacts are missing or empty."

            if (( ${#missing_artifacts[@]} > 0 )); then
              printf 'Missing artifacts:\n'
              printf '  - %s\n' "${missing_artifacts[@]}"
            fi

            if (( ${#empty_artifacts[@]} > 0 )); then
              printf 'Empty artifacts:\n'
              printf '  - %s\n' "${empty_artifacts[@]}"
            fi

            echo "Downloaded artifacts:"
            find coverage-artifacts -maxdepth 2 -type d -print 2>/dev/null | sort || true
            exit 1
          fi

          printf 'Validated %s expected coverage artifacts.\n' "${#expected_artifacts[@]}"

      - name: Aggregate Kover coverage summary
        run: python3 .github/scripts/aggregate-kover-coverage.py coverage-artifacts

      - name: Upload aggregated coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-all
          path: coverage-artifacts/
          retention-days: 30

  ci-status:
    name: CI Status
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - catalog-governance
      - gitleaks
      - build
      - coverage-report
      - changes
      - test-tokenizer-core
      - test-tokenizer-japanese
      - test-tokenizer-korean
      - test-lingua
      - test-text-search
      - test-examples
    if: always()
    steps:
      - name: Check all jobs
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          echo "Job results: $RESULTS"
          if echo "$RESULTS" | grep -qE "failure|cancelled"; then
            echo "CI failed"
            exit 1
          fi
          echo "CI passed (skipped jobs treated as success)"
