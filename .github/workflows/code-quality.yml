name: Code Quality Analysis

on:
  schedule:
    - cron: '0 2 * * *'  # 매일 UTC 02:00 (KST 11:00)
  workflow_dispatch:

env:
  JAVA_VERSION: '21'
  JAVA_DISTRIBUTION: 'temurin'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  codeql:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        language: [java-kotlin, actions]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}

      - name: Pin Kotlin for CodeQL extractor
        if: matrix.language == 'java-kotlin'
        run: |
          perl -0pi -e 's/kotlin = "2\.4\.0"/kotlin = "2.3.21"/' gradle/libs.versions.toml
          grep -n 'kotlin = "2.3.21"' gradle/libs.versions.toml

      - name: Setup JDK
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@v5.6.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - uses: gradle/actions/setup-gradle@v6.2.0
        if: matrix.language == 'java-kotlin'
        with:
          gradle-version: wrapper

      - name: Build with Gradle
        if: matrix.language == 'java-kotlin'
        # Keep the dormant java-kotlin build compile-only for the re-enable path.
        run: ./gradlew assemble --no-daemon
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:${{ matrix.language }}'
