<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="1040" viewBox="0 0 1760 1040" role="img" aria-labelledby="title desc">
<title id="title">text-search class contract map</title>
<desc id="desc">UML-style class map for text-search public API, immutable automaton, internal trie core, options, and result types.</desc>
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
    <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#94a3b8" flood-opacity="0.16"/>
  </filter>
  <marker id="depBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M 0 0 L 10 5 L 0 10 Z" fill="#2563eb" stroke-dasharray="none"/>
  </marker>
  <marker id="depGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M 0 0 L 10 5 L 0 10 Z" fill="#059669" stroke-dasharray="none"/>
  </marker>
  <marker id="depOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M 0 0 L 10 5 L 0 10 Z" fill="#d97706" stroke-dasharray="none"/>
  </marker>
  <marker id="depPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M 0 0 L 10 5 L 0 10 Z" fill="#7c3aed" stroke-dasharray="none"/>
  </marker>
  <marker id="depGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M 0 0 L 10 5 L 0 10 Z" fill="#64748b" stroke-dasharray="none"/>
  </marker>
  <marker id="realize" viewBox="0 0 12 10" refX="11" refY="5" markerWidth="11" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M 1 1 L 11 5 L 1 9 Z" fill="#ffffff" stroke="#64748b" stroke-width="1.5" stroke-dasharray="none"/>
  </marker>
  <style>
    .canvas{fill:#f8fafc}
    .frame{fill:#fff;stroke:#cbd5e1;stroke-width:1.4}
    .group{fill:#f8fafc;stroke:#c6d3e1;stroke-width:1.1}
    .title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:50px;fill:#172033}
    .subtitle,.body,.footer,.tag{font-family:"Comic Mono","Comic Sans MS",sans-serif;fill:#475569}
    .subtitle{font-size:17px}
    .footer{font-size:14px}
    .tag{font-size:14px;font-weight:700}
    .name{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:28px;fill:#172033}
    .small-name{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:24px;fill:#172033}
    .body{font-size:15px}
    .card{filter:url(#shadow);stroke-width:1.3}
    .sep{stroke-width:1.0}
    .dep{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:7 6}
    .solid{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  </style>
</defs>

<rect class="canvas" width="1760" height="1040" rx="30"/>
<rect class="frame" x="24" y="24" width="1712" height="992" rx="26"/>
<text class="title" x="60" y="82">text-search Class Contract Map</text>
<text class="subtitle" x="62" y="116">Public builders create an immutable automaton; the automaton delegates matching to an internal trie and returns typed results.</text>

<rect class="group" x="58" y="152" width="455" height="722" rx="18"/>
<text class="tag" x="86" y="184">BUILD SURFACE</text>

<rect class="group" x="548" y="152" width="408" height="722" rx="18"/>
<text class="tag" x="576" y="184">IMMUTABLE SEARCH API</text>

<rect class="group" x="990" y="152" width="348" height="722" rx="18"/>
<text class="tag" x="1018" y="184">INTERNAL TRIE CORE</text>

<rect class="group" x="1370" y="152" width="334" height="722" rx="18"/>
<text class="tag" x="1398" y="184">OPTIONS AND RESULTS</text>

<rect class="card" x="92" y="224" width="388" height="158" rx="6" fill="#dbeafe" stroke="#2563eb"/>
<text class="tag" x="286" y="250" text-anchor="middle">DSL builder</text>
<text class="name" x="286" y="284" text-anchor="middle">AhoCorasickBuilder&lt;V&gt;</text>
<line class="sep" x1="92" y1="302" x2="480" y2="302" stroke="#93c5fd"/>
<text class="body" x="120" y="330">+ keyword(keyword, value)</text>
<text class="body" x="120" y="354">+ keywords(vararg / map)</text>
<text class="body" x="120" y="378">+ ignoreCase, allowOverlaps, boundary</text>

<rect class="card" x="92" y="464" width="388" height="194" rx="6" fill="#eff6ff" stroke="#2563eb"/>
<text class="tag" x="286" y="490" text-anchor="middle">step builder</text>
<text class="name" x="286" y="524" text-anchor="middle">Automaton.Builder&lt;V&gt;</text>
<line class="sep" x1="92" y1="542" x2="480" y2="542" stroke="#93c5fd"/>
<text class="body" x="120" y="570">+ add(keyword, value)</text>
<text class="body" x="120" y="594">+ addAll(map)</text>
<text class="body" x="120" y="618">+ options(SearchOptions)</text>
<text class="body" x="120" y="642">+ build(): AhoCorasickAutomaton</text>

<rect class="card" x="590" y="250" width="324" height="284" rx="6" fill="#e0f2fe" stroke="#0284c7"/>
<text class="name" x="752" y="280" text-anchor="middle">AhoCorasick</text>
<text class="name" x="752" y="306" text-anchor="middle">Automaton&lt;V&gt;</text>
<line class="sep" x1="590" y1="308" x2="914" y2="308" stroke="#7dd3fc"/>
<text class="body" x="618" y="336">- core: TrieCore</text>
<text class="body" x="618" y="360">- values: Map&lt;String,V&gt;</text>
<text class="body" x="618" y="384">+ options: SearchOptions</text>
<line class="sep" x1="590" y1="404" x2="914" y2="404" stroke="#7dd3fc"/>
<text class="body" x="618" y="432">+ parseText(text)</text>
<text class="body" x="618" y="456">+ firstMatch(text)</text>
<text class="body" x="618" y="480">+ containsMatch(text)</text>
<text class="body" x="618" y="504">+ tokenize(text), replaceAll(text)</text>

<rect class="card" x="590" y="628" width="324" height="114" rx="6" fill="#ecfdf5" stroke="#059669"/>
<text class="tag" x="752" y="654" text-anchor="middle">flow extension</text>
<text class="small-name" x="752" y="688" text-anchor="middle">matchesAsFlow(text)</text>
<text class="body" x="618" y="720">channelFlow + Dispatchers.Default</text>

<rect class="card" x="1028" y="214" width="272" height="198" rx="6" fill="#fef3c7" stroke="#d97706"/>
<text class="name" x="1164" y="250" text-anchor="middle">TrieCore</text>
<line class="sep" x1="1028" y1="272" x2="1300" y2="272" stroke="#fcd34d"/>
<text class="body" x="1052" y="300">- rootState: State</text>
<text class="body" x="1052" y="324">- config: InternalTrieConfig</text>
<line class="sep" x1="1028" y1="344" x2="1300" y2="344" stroke="#fcd34d"/>
<text class="body" x="1052" y="372">+ parseText(text)</text>
<text class="body" x="1052" y="396">+ runParseText(...)</text>

<rect class="card" x="1028" y="486" width="272" height="166" rx="6" fill="#fff7ed" stroke="#d97706"/>
<text class="name" x="1164" y="522" text-anchor="middle">State</text>
<line class="sep" x1="1028" y1="544" x2="1300" y2="544" stroke="#fed7aa"/>
<text class="body" x="1052" y="572">+ failure: State?</text>
<text class="body" x="1052" y="596">+ nextState(ch)</text>
<text class="body" x="1052" y="620">+ addState(keyword)</text>
<text class="body" x="1052" y="644">+ emit(): Collection&lt;String&gt;</text>

<rect class="card" x="1410" y="214" width="254" height="144" rx="6" fill="#f1f5f9" stroke="#64748b"/>
<text class="name" x="1537" y="250" text-anchor="middle">SearchOptions</text>
<line class="sep" x1="1410" y1="272" x2="1664" y2="272" stroke="#cbd5e1"/>
<text class="body" x="1432" y="300">ignoreCase / overlaps</text>
<text class="body" x="1432" y="324">wordBoundary / normalization</text>
<text class="body" x="1432" y="348">stopOnFirstMatch</text>

<rect class="card" x="1410" y="418" width="254" height="134" rx="6" fill="#dcfce7" stroke="#059669"/>
<text class="name" x="1537" y="448" text-anchor="middle">AhoCorasick</text>
<text class="name" x="1537" y="474" text-anchor="middle">Match&lt;V&gt;</text>
<line class="sep" x1="1410" y1="476" x2="1664" y2="476" stroke="#bbf7d0"/>
<text class="body" x="1432" y="504">start, end, keyword, value</text>
<text class="body" x="1432" y="528">+ length</text>

<rect class="card" x="1410" y="610" width="254" height="104" rx="6" fill="#ede9fe" stroke="#7c3aed"/>
<text class="tag" x="1537" y="636" text-anchor="middle">sealed interface</text>
<text class="name" x="1537" y="670" text-anchor="middle">SearchToken&lt;V&gt;</text>

<rect class="card" x="1392" y="766" width="124" height="70" rx="6" fill="#f5f3ff" stroke="#7c3aed"/>
<text class="small-name" x="1454" y="808" text-anchor="middle">Match</text>

<rect class="card" x="1544" y="766" width="124" height="70" rx="6" fill="#f5f3ff" stroke="#7c3aed"/>
<text class="small-name" x="1606" y="808" text-anchor="middle">Fragment</text>

<path class="dep" d="M 480 560 L 535 560 L 535 392 L 590 392" stroke="#2563eb" marker-end="url(#depBlue)"/>
<path class="dep" d="M 480 302 L 535 302 L 535 368 L 590 368" stroke="#2563eb" marker-end="url(#depBlue)"/>
<path class="dep" d="M 914 334 L 980 334 L 980 314 L 1028 314" stroke="#d97706" marker-end="url(#depOrange)"/>
<path class="dep" d="M 914 386 L 950 386 L 950 132 L 1537 132 L 1537 214" stroke="#64748b" marker-end="url(#depGray)"/>
<path class="dep" d="M 914 456 L 1348 456 L 1348 486 L 1410 486" stroke="#059669" marker-end="url(#depGreen)"/>
<path class="dep" d="M 914 502 L 958 502 L 958 690 L 1354 690 L 1354 662 L 1410 662" stroke="#7c3aed" marker-end="url(#depPurple)"/>
<path class="dep" d="M 752 628 L 752 534" stroke="#059669" marker-end="url(#depGreen)"/>
<path class="dep" d="M 1300 314 L 1360 314 L 1360 286 L 1410 286" stroke="#d97706" marker-end="url(#depOrange)"/>
<path class="solid" d="M 1164 486 L 1164 412" stroke="#d97706" marker-end="url(#depOrange)"/>
<path class="dep" d="M 1454 766 L 1454 714" stroke="#64748b" marker-end="url(#realize)"/>
<path class="dep" d="M 1606 766 L 1606 714" stroke="#64748b" marker-end="url(#realize)"/>

<rect x="100" y="910" width="1560" height="54" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.1"/>
<text class="footer" x="880" y="944" text-anchor="middle">Automaton instances are immutable after build; Flow uses raw streaming unless options require eager post-processing.</text>
</svg>
