<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="900" viewBox="0 0 1760 900" role="img" aria-labelledby="title desc">
<title id="title">text-search processing flow</title>
<desc id="desc">Processing flow from input text through option-driven preprocessing, TrieCore scanning, match policy filtering, and public API results.</desc>
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
    <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#94a3b8" flood-opacity="0.16"/>
  </filter>
  <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M 0 0 L 10 5 L 0 10 Z" fill="#2563eb" stroke-dasharray="none"/>
  </marker>
  <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M 0 0 L 10 5 L 0 10 Z" fill="#d97706" stroke-dasharray="none"/>
  </marker>
  <marker id="arrowPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M 0 0 L 10 5 L 0 10 Z" fill="#7c3aed" stroke-dasharray="none"/>
  </marker>
  <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M 0 0 L 10 5 L 0 10 Z" fill="#059669" stroke-dasharray="none"/>
  </marker>
  <style>
    .canvas{fill:#f8fafc}
    .frame{fill:#fff;stroke:#cbd5e1;stroke-width:1.4}
    .title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:50px;fill:#172033}
    .subtitle,.body,.tag,.footer{font-family:"Comic Mono","Comic Sans MS",sans-serif;fill:#475569}
    .subtitle{font-size:17px}
    .tag{font-size:14px;font-weight:700}
    .body{font-size:15px}
    .footer{font-size:14px}
    .name{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:28px;fill:#172033}
    .small-name{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:24px;fill:#172033}
    .card{filter:url(#shadow);stroke-width:1.3}
    .sep{stroke-width:1.0}
    .line{fill:none;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
  </style>
</defs>

<rect class="canvas" width="1760" height="900" rx="30"/>
<rect class="frame" x="24" y="24" width="1712" height="852" rx="26"/>
<text class="title" x="60" y="82">Processing Flow</text>
<text class="subtitle" x="62" y="116">SearchOptions shape the text pipeline and result policy while TrieCore performs the single-pass scan.</text>

<rect class="card" x="72" y="322" width="230" height="128" rx="8" fill="#dbeafe" stroke="#2563eb"/>
<text class="name" x="187" y="374" text-anchor="middle">Input Text</text>
<text class="body" x="106" y="412">CharSequence</text>

<rect class="card" x="372" y="250" width="300" height="272" rx="8" fill="#fef3c7" stroke="#d97706"/>
<text class="tag" x="522" y="284" text-anchor="middle">OPTION-DRIVEN</text>
<text class="name" x="522" y="322" text-anchor="middle">Text Pipeline</text>
<line class="sep" x1="372" y1="344" x2="672" y2="344" stroke="#fcd34d"/>
<text class="body" x="402" y="380">+ normalize NFC / NFKC</text>
<text class="body" x="402" y="410">+ lowercase when ignoreCase</text>
<text class="body" x="402" y="440">+ keep OffsetMapping</text>
<text class="body" x="402" y="470">+ preserve original offsets</text>

<rect class="card" x="742" y="250" width="300" height="272" rx="8" fill="#fff7ed" stroke="#d97706"/>
<text class="tag" x="892" y="284" text-anchor="middle">SINGLE PASS</text>
<text class="name" x="892" y="322" text-anchor="middle">TrieCore Scan</text>
<line class="sep" x1="742" y1="344" x2="1042" y2="344" stroke="#fed7aa"/>
<text class="body" x="772" y="380">+ walk State transitions</text>
<text class="body" x="772" y="410">+ follow failure links</text>
<text class="body" x="772" y="440">+ collect Emit positions</text>
<text class="body" x="772" y="470">O(n + m + z)</text>

<rect class="card" x="1112" y="250" width="300" height="272" rx="8" fill="#ede9fe" stroke="#7c3aed"/>
<text class="tag" x="1262" y="284" text-anchor="middle">RESULT POLICY</text>
<text class="name" x="1262" y="322" text-anchor="middle">Match Shaping</text>
<line class="sep" x1="1112" y1="344" x2="1412" y2="344" stroke="#c4b5fd"/>
<text class="body" x="1142" y="380">+ word boundary filter</text>
<text class="body" x="1142" y="410">+ overlap policy</text>
<text class="body" x="1142" y="440">+ stopOnFirstMatch</text>
<text class="body" x="1142" y="470">+ restore original offsets</text>

<rect class="card" x="1482" y="250" width="210" height="272" rx="8" fill="#dcfce7" stroke="#059669"/>
<text class="tag" x="1587" y="284" text-anchor="middle">PUBLIC API</text>
<text class="small-name" x="1587" y="322" text-anchor="middle">Results</text>
<line class="sep" x1="1482" y1="344" x2="1692" y2="344" stroke="#bbf7d0"/>
<text class="body" x="1512" y="378">parseText list</text>
<text class="body" x="1512" y="408">firstMatch</text>
<text class="body" x="1512" y="438">containsMatch</text>
<text class="body" x="1512" y="468">tokens / replace</text>
<text class="body" x="1512" y="498">Flow matches</text>

<path class="line" d="M 302 386 L 372 386" stroke="#2563eb" marker-end="url(#arrowBlue)"/>
<path class="line" d="M 672 386 L 742 386" stroke="#d97706" marker-end="url(#arrowOrange)"/>
<path class="line" d="M 1042 386 L 1112 386" stroke="#7c3aed" marker-end="url(#arrowPurple)"/>
<path class="line" d="M 1412 386 L 1482 386" stroke="#059669" marker-end="url(#arrowGreen)"/>

<rect class="card" x="372" y="610" width="1040" height="88" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
<text class="tag" x="400" y="642">FLOW EXTENSION</text>
<text class="body" x="400" y="674">matchesAsFlow(text) runs with channelFlow + Dispatchers.Default; it streams raw matches unless selected options require eager post-processing.</text>

<path class="line" d="M 892 522 L 892 610" stroke="#d97706" marker-end="url(#arrowOrange)"/>
<path class="line" d="M 1412 654 L 1452 654 L 1452 500 L 1482 500" stroke="#059669" marker-end="url(#arrowGreen)"/>

<rect x="92" y="770" width="1576" height="54" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.1"/>
<text class="footer" x="880" y="804" text-anchor="middle">The automaton stays immutable after build; request-time work is limited to text preparation, trie scan, and result policy application.</text>
</svg>
