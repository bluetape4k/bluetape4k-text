<svg xmlns="http://www.w3.org/2000/svg" width="2040" height="1148" viewBox="0 0 2040 1148" role="img" aria-labelledby="title desc">
<title id="title">bluetape4k-text architecture</title>
<desc id="desc">Static architecture view of bluetape4k-text arranged as direct row flows from public entrypoints through internals and engines to results.</desc>
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#94a3b8" flood-opacity="0.20"/></filter>
  <marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#059669"/></marker>
  <marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#d97706"/></marker>
  <marker id="rose" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#e11d48"/></marker>
  <marker id="violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#7c3aed"/></marker>
  <marker id="cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#0891b2"/></marker>
  <style>
    .title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:52px;fill:#172033}
    .subtitle,.body,.footer{font-family:"Comic Mono","Comic Sans MS",sans-serif;fill:#475569}
    .subtitle{font-size:18px}.body{font-size:18px}.footer{font-size:15px}
    .lane{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:30px;fill:#172033}
    .label{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:31px;fill:#172033}
    .line{fill:none;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
  </style>
</defs>

<rect width="2040" height="1148" rx="30" fill="#f8fafc"/>
<rect x="24" y="24" width="1992" height="1100" rx="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/>
<text class="title" x="60" y="82">bluetape4k-text Architecture</text>
<text class="subtitle" x="62" y="116">Static ownership view: each runtime lane keeps a direct path from facade to engine to caller-visible result.</text>

<rect x="70" y="155" width="410" height="838" rx="18" fill="#f8fafc" stroke="#b6c7dc" stroke-width="1.2" stroke-dasharray="8 7"/>
<text class="lane" x="100" y="199">Public entrypoints</text>
<rect x="120" y="250" width="310" height="112" rx="10" fill="#dcfce7" stroke="#059669" stroke-width="1.2" filter="url(#shadow)"/>
<text class="label" x="275" y="292" text-anchor="middle">KoreanProcessor</text>
<text class="body" x="152" y="327">facade object</text>
<rect x="120" y="450" width="310" height="112" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.2" filter="url(#shadow)"/>
<text class="label" x="275" y="492" text-anchor="middle">JapaneseProcessor</text>
<text class="body" x="152" y="527">facade object</text>
<rect x="120" y="650" width="310" height="112" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.2" filter="url(#shadow)"/>
<text class="label" x="275" y="692" text-anchor="middle">Lingua builders</text>
<text class="body" x="152" y="727">detector factories</text>
<rect x="120" y="850" width="310" height="112" rx="10" fill="#fff1f2" stroke="#e11d48" stroke-width="1.2" filter="url(#shadow)"/>
<text class="label" x="275" y="892" text-anchor="middle">AhoCorasick DSL</text>
<text class="body" x="152" y="920">builder DSL</text>
<text class="body" x="152" y="944">immutable automaton</text>

<rect x="565" y="155" width="455" height="838" rx="18" fill="#f8fafc" stroke="#b6c7dc" stroke-width="1.2" stroke-dasharray="8 7"/>
<text class="lane" x="595" y="199">Module internals</text>
<rect x="612" y="240" width="360" height="132" rx="10" fill="#ecfeff" stroke="#0891b2" stroke-width="1.2" filter="url(#shadow)"/>
<text class="label" x="792" y="282" text-anchor="middle">Tokenizer contract</text>
<text class="body" x="646" y="316">TokenizeRequest</text>
<text class="body" x="646" y="340">TokenizeResponse</text>
<text class="body" x="646" y="364">Dictionary utilities</text>
<rect x="612" y="440" width="360" height="132" rx="10" fill="#ecfeff" stroke="#0891b2" stroke-width="1.2" filter="url(#shadow)"/>
<text class="label" x="792" y="482" text-anchor="middle">Tokenizer contract</text>
<text class="body" x="646" y="516">BlockwordRequest</text>
<text class="body" x="646" y="540">BlockwordResponse</text>
<text class="body" x="646" y="564">CharArray collections</text>
<rect x="612" y="640" width="360" height="132" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.2" filter="url(#shadow)"/>
<text class="label" x="792" y="682" text-anchor="middle">Detector config</text>
<text class="body" x="646" y="716">language sets, preloading</text>
<text class="body" x="646" y="740">Unicode block filters</text>
<rect x="612" y="840" width="360" height="132" rx="10" fill="#fee2e2" stroke="#e11d48" stroke-width="1.2" filter="url(#shadow)"/>
<text class="label" x="792" y="882" text-anchor="middle">Search core</text>
<text class="body" x="646" y="916">TrieCore, State, Emit</text>
<text class="body" x="646" y="940">normalization</text>
<text class="body" x="646" y="964">offset mapping</text>

<rect x="1095" y="155" width="430" height="838" rx="18" fill="#f8fafc" stroke="#b6c7dc" stroke-width="1.2" stroke-dasharray="8 7"/>
<text class="lane" x="1125" y="199">Runtime engines</text>
<rect x="1142" y="250" width="336" height="112" rx="10" fill="#dcfce7" stroke="#059669" stroke-width="1.2" filter="url(#shadow)"/>
<text class="label" x="1310" y="292" text-anchor="middle">Korean pipeline</text>
<text class="body" x="1176" y="320">normalizer, tokenizer</text>
<text class="body" x="1176" y="344">phrase, stemmer</text>
<rect x="1142" y="450" width="336" height="112" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.2" filter="url(#shadow)"/>
<text class="label" x="1310" y="492" text-anchor="middle">Kuromoji IPAdic</text>
<text class="body" x="1176" y="520">Japanese morphology</text>
<text class="body" x="1176" y="544">token stream</text>
<rect x="1142" y="650" width="336" height="112" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.2" filter="url(#shadow)"/>
<text class="label" x="1310" y="692" text-anchor="middle">Lingua models</text>
<text class="body" x="1176" y="727">LanguageDetector instances</text>
<rect x="1142" y="850" width="336" height="112" rx="10" fill="#fff1f2" stroke="#e11d48" stroke-width="1.2" filter="url(#shadow)"/>
<text class="label" x="1310" y="892" text-anchor="middle">Trie automaton</text>
<text class="body" x="1176" y="927">immutable after build()</text>

<rect x="1600" y="155" width="354" height="838" rx="18" fill="#f8fafc" stroke="#b6c7dc" stroke-width="1.2" stroke-dasharray="8 7"/>
<text class="lane" x="1630" y="199">Results</text>
<rect x="1642" y="250" width="270" height="112" rx="10" fill="#dcfce7" stroke="#059669" stroke-width="1.2" filter="url(#shadow)"/>
<text class="label" x="1777" y="292" text-anchor="middle">Korean output</text>
<text class="body" x="1676" y="320">tokens, phrases</text>
<text class="body" x="1676" y="344">stems, masks</text>
<rect x="1642" y="450" width="270" height="112" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.2" filter="url(#shadow)"/>
<text class="label" x="1777" y="492" text-anchor="middle">Japanese output</text>
<text class="body" x="1676" y="520">tokens, nouns</text>
<text class="body" x="1676" y="544">masks</text>
<rect x="1642" y="650" width="270" height="112" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.2" filter="url(#shadow)"/>
<text class="label" x="1777" y="692" text-anchor="middle">Languages</text>
<text class="body" x="1676" y="727">Language or Set</text>
<rect x="1642" y="850" width="270" height="112" rx="10" fill="#fff1f2" stroke="#e11d48" stroke-width="1.2" filter="url(#shadow)"/>
<text class="label" x="1777" y="892" text-anchor="middle">Matches</text>
<text class="body" x="1676" y="920">offsets, values</text>
<text class="body" x="1676" y="944">replacements</text>

<path class="line" d="M 430 306 L 612 306" stroke="#0891b2" marker-end="url(#cyan)"/>
<path class="line" d="M 972 306 L 1142 306" stroke="#059669" marker-end="url(#green)"/>
<path class="line" d="M 1478 306 L 1642 306" stroke="#059669" marker-end="url(#green)"/>
<path class="line" d="M 430 506 L 612 506" stroke="#0891b2" marker-end="url(#cyan)"/>
<path class="line" d="M 972 506 L 1142 506" stroke="#d97706" marker-end="url(#amber)"/>
<path class="line" d="M 1478 506 L 1642 506" stroke="#d97706" marker-end="url(#amber)"/>
<path class="line" d="M 430 706 L 612 706" stroke="#7c3aed" marker-end="url(#violet)"/>
<path class="line" d="M 972 706 L 1142 706" stroke="#7c3aed" marker-end="url(#violet)"/>
<path class="line" d="M 1478 706 L 1642 706" stroke="#7c3aed" marker-end="url(#violet)"/>
<path class="line" d="M 430 906 L 612 906" stroke="#e11d48" marker-end="url(#rose)"/>
<path class="line" d="M 972 906 L 1142 906" stroke="#e11d48" marker-end="url(#rose)"/>
<path class="line" d="M 1478 906 L 1642 906" stroke="#e11d48" marker-end="url(#rose)"/>

<text class="footer" x="1020" y="1068" text-anchor="middle">The tokenizer lanes share tokenizer-core contracts; lingua and text-search keep separate engines and output contracts.</text>
</svg>
