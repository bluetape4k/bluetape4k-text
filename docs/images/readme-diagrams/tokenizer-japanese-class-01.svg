<svg xmlns="http://www.w3.org/2000/svg" width="998" height="1923" viewBox="0 0 998 1923" role="img" aria-label="tokenizer japanese Class Structure">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="openArrow" markerWidth="10" markerHeight="8" refX="8.5" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 8.5 4 L 1 7" fill="none" stroke="#758297" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="inherit" markerWidth="11" markerHeight="10" refX="9.5" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 1 L 9.5 5 L 0.5 9 Z" fill="#ffffff" stroke="#758297" stroke-width="1.7"/></marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:43px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:15px;font-weight:400;fill:#536273}
    .label{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:25px;font-weight:400;fill:#102033}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
    .strong{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:13px;font-weight:400;fill:#102033}
    .card{stroke-width:2.1;filter:url(#shadow)}.compartment{stroke-width:1.5;fill:none}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#openArrow)}
    .plainLine{stroke:#758297;stroke-width:2.1;fill:none}
    .dashed{stroke:#758297;stroke-width:2.1;stroke-dasharray:7 6;fill:none;marker-end:url(#openArrow)}
    .inheritLine{stroke:#758297;stroke-width:2.2;fill:none;marker-end:url(#inherit)}
    .implLine{stroke:#758297;stroke-width:2.2;stroke-dasharray:8 7;fill:none;marker-end:url(#inherit)}
  </style>
</defs>
<rect class="canvas" width="998" height="1923"/>
<rect class="frame" x="32" y="28" width="934" height="1867" rx="28"/>
<text class="title" x="66" y="82">tokenizer japanese Class Structure</text>
<text class="subtitle" x="70" y="118">UML classes from the original Mermaid source</text>
<path class="dashed" d="M499 1363 L499 1489"/>
<path class="line" d="M274 656 L274 1141 L499 1141 L499 1188"/>
<path class="line" d="M499 334 L499 824"/>
<path class="line" d="M499 334 L499 397 L274 397 L274 460"/>
<path class="line" d="M724 698 L724 753 L499 753 L499 824"/>
<path class="line" d="M724 460 L724 381 L499 381 L499 334"/>
<path class="line" d="M724 460 L724 737 L274 737 L274 656"/>
<g transform="translate(309,180)">
  <rect class="card" x="0" y="0" width="380" height="154" rx="5" fill="#E8F3FF" stroke="#5B8DEF"/>
  <line class="compartment" x1="0" y1="78" x2="380" y2="78" stroke="#5B8DEF"/>
  <text class="small" x="190" y="26" text-anchor="middle">«object»</text>
  <text class="label" x="190" y="61" text-anchor="middle">JapaneseBlockwordProcessor</text>
  <text class="mono" x="18" y="108">+findBlockwords(text) List~Token~</text>
<text class="mono" x="18" y="129">+maskBlockwords(request) BlockwordResponse</text>
</g>
<g transform="translate(84,460)">
  <rect class="card" x="0" y="0" width="380" height="196" rx="5" fill="#EAF7EF" stroke="#58A978"/>
  <line class="compartment" x1="0" y1="78" x2="380" y2="78" stroke="#58A978"/>
  <text class="small" x="190" y="26" text-anchor="middle">«object»</text>
  <text class="label" x="190" y="61" text-anchor="middle">JapaneseTokenizer</text>
  <text class="mono" x="18" y="108">-tokenizer: Tokenizer</text>
<text class="mono" x="18" y="129">+tokenize(text) List~Token~</text>
<text class="mono" x="18" y="150">+filter(tokens, predicate) List~Token~</text>
<text class="mono" x="18" y="171">+filterNoun(tokens) List~Token~</text>
</g>
<g transform="translate(534,460)">
  <rect class="card" x="0" y="0" width="380" height="238" rx="5" fill="#FFF3D9" stroke="#D6A441"/>
  <line class="compartment" x1="0" y1="78" x2="380" y2="78" stroke="#D6A441"/>
  <text class="small" x="190" y="26" text-anchor="middle">«object»</text>
  <text class="label" x="190" y="61" text-anchor="middle">JapaneseProcessor</text>
  <text class="mono" x="18" y="108">+tokenize(text) List~Token~</text>
<text class="mono" x="18" y="129">+filter(tokens, predicate) List~Token~</text>
<text class="mono" x="18" y="150">+filterNoun(tokens) List~Token~</text>
<text class="mono" x="18" y="171">+findBlockwords(text) List~Token~</text>
<text class="mono" x="18" y="192">+maskBlockwords(request) BlockwordResponse</text>
<text class="mono" x="18" y="213">+addBlockwords(words)</text>
</g>
<g transform="translate(309,824)">
  <rect class="card" x="0" y="0" width="380" height="238" rx="5" fill="#FDECEF" stroke="#DC6B82"/>
  <line class="compartment" x1="0" y1="78" x2="380" y2="78" stroke="#DC6B82"/>
  <text class="small" x="190" y="26" text-anchor="middle">«object»</text>
  <text class="label" x="190" y="61" text-anchor="middle">JapaneseDictionaryProvider</text>
  <text class="mono" x="18" y="108">+BASE_PATH: String</text>
<text class="mono" x="18" y="129">+blockWordDictionary: CharArraySet</text>
<text class="mono" x="18" y="150">+readWordsAsSet(paths) MutableSet~String~</text>
<text class="mono" x="18" y="171">+readWords(paths) CharArraySet</text>
<text class="mono" x="18" y="192">+addBlockwords(words)</text>
<text class="mono" x="18" y="213">+removeBlockwords(words)</text>
</g>
<g transform="translate(309,1188)">
  <rect class="card" x="0" y="0" width="380" height="175" rx="5" fill="#E9F7F6" stroke="#45A7A1"/>
  <line class="compartment" x1="0" y1="78" x2="380" y2="78" stroke="#45A7A1"/>
  <text class="small" x="190" y="26" text-anchor="middle">«Kuromoji»</text>
  <text class="label" x="190" y="61" text-anchor="middle">TokenBase</text>
  <text class="mono" x="18" y="108">+surface: String</text>
<text class="mono" x="18" y="129">+position: Int</text>
<text class="mono" x="18" y="150">+allFeaturesArray: Array~String~</text>
</g>
<g transform="translate(309,1489)">
  <rect class="card" x="0" y="0" width="380" height="238" rx="5" fill="#F1ECFF" stroke="#8A72D6"/>
  <line class="compartment" x1="0" y1="78" x2="380" y2="78" stroke="#8A72D6"/>
  <text class="small" x="190" y="26" text-anchor="middle">«extensions»</text>
  <text class="label" x="190" y="61" text-anchor="middle">TokenBaseSupport</text>
  <text class="mono" x="18" y="108">+isNoun() Boolean</text>
<text class="mono" x="18" y="129">+isVerb() Boolean</text>
<text class="mono" x="18" y="150">+isNounOrVerb() Boolean</text>
<text class="mono" x="18" y="171">+isAdjective() Boolean</text>
<text class="mono" x="18" y="192">+isJosa() Boolean</text>
<text class="mono" x="18" y="213">+isPunctuation() Boolean</text>
</g>
</svg>
