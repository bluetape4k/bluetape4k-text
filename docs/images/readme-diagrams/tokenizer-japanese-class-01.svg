<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="980" viewBox="0 0 1760 980" role="img" aria-labelledby="title desc">
<title id="title">tokenizer-japanese class contract map</title>
<desc id="desc">Class map for JapaneseProcessor facade, Kuromoji-backed tokenizer, POS helpers, blockword processor, and lazy runtime dictionary.</desc>
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
    <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#94a3b8" flood-opacity="0.16"/>
  </filter>
  <marker id="depBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#2563eb" stroke-dasharray="none"/></marker>
  <marker id="depOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#d97706" stroke-dasharray="none"/></marker>
  <marker id="depGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#059669" stroke-dasharray="none"/></marker>
  <marker id="depPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#7c3aed" stroke-dasharray="none"/></marker>
  <style>
    .canvas{fill:#f8fafc}.frame{fill:#fff;stroke:#cbd5e1;stroke-width:1.4}
    .group{fill:#f8fafc;stroke:#c6d3e1;stroke-width:1.1}
    .title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:50px;fill:#172033}
    .subtitle,.body,.footer,.tag{font-family:"Comic Mono","Comic Sans MS",sans-serif;fill:#475569}
    .subtitle{font-size:17px}.footer{font-size:14px}.tag{font-size:14px;font-weight:700}
    .name{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:28px;fill:#172033}
    .small-name{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:24px;fill:#172033}
    .body{font-size:15px}.card{filter:url(#shadow);stroke-width:1.3}.sep{stroke-width:1.0}
    .dep{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:7 6}
  </style>
</defs>

<rect class="canvas" width="1760" height="980" rx="30"/>
<rect class="frame" x="24" y="24" width="1712" height="932" rx="26"/>
<text class="title" x="60" y="82">tokenizer-japanese Class Contract Map</text>
<text class="subtitle" x="62" y="116">JapaneseProcessor exposes one facade over Kuromoji tokenization, POS filtering, blockword masking, and mutable in-memory dictionaries.</text>

<rect class="group" x="58" y="152" width="370" height="680" rx="18"/>
<text class="tag" x="86" y="184">FACADE</text>
<rect class="group" x="462" y="152" width="780" height="300" rx="18"/>
<text class="tag" x="490" y="184">MORPHOLOGICAL ANALYSIS</text>
<rect class="group" x="462" y="496" width="1228" height="336" rx="18"/>
<text class="tag" x="490" y="528">BLOCKWORD PROCESSING</text>

<rect class="card" x="94" y="356" width="298" height="238" rx="6" fill="#dbeafe" stroke="#2563eb"/>
<text class="tag" x="243" y="386" text-anchor="middle">object facade</text>
<text class="name" x="243" y="420" text-anchor="middle">JapaneseProcessor</text>
<line class="sep" x1="94" y1="442" x2="392" y2="442" stroke="#93c5fd"/>
<text class="body" x="124" y="472">+ tokenize / filterNoun</text>
<text class="body" x="124" y="502">+ findBlockwords</text>
<text class="body" x="124" y="532">+ maskBlockwords</text>
<text class="body" x="124" y="562">+ add / remove / clear</text>

<rect class="card" x="508" y="222" width="290" height="170" rx="6" fill="#e0f2fe" stroke="#0284c7"/>
<text class="tag" x="653" y="252" text-anchor="middle">object</text>
<text class="name" x="653" y="286" text-anchor="middle">JapaneseTokenizer</text>
<line class="sep" x1="508" y1="308" x2="798" y2="308" stroke="#7dd3fc"/>
<text class="body" x="536" y="338">+ tokenize(text): List&lt;Token&gt;</text>
<text class="body" x="536" y="362">+ filter(tokens, predicate)</text>
<text class="body" x="536" y="386">+ filterNoun(tokens)</text>

<rect class="card" x="862" y="222" width="250" height="170" rx="6" fill="#fff7ed" stroke="#d97706"/>
<text class="small-name" x="987" y="272" text-anchor="middle">Kuromoji IPAdic</text>
<line class="sep" x1="862" y1="300" x2="1112" y2="300" stroke="#fed7aa"/>
<text class="body" x="890" y="330">Tokenizer.Builder().build()</text>
<text class="body" x="890" y="360">lazy singleton analyzer</text>

<rect class="card" x="510" y="590" width="318" height="190" rx="6" fill="#ede9fe" stroke="#7c3aed"/>
<text class="tag" x="669" y="620" text-anchor="middle">object</text>
<text class="name" x="669" y="654" text-anchor="middle">JapaneseBlockword</text>
<text class="name" x="669" y="684" text-anchor="middle">Processor</text>
<line class="sep" x1="510" y1="704" x2="828" y2="704" stroke="#c4b5fd"/>
<text class="body" x="540" y="734">+ findBlockwords(text)</text>
<text class="body" x="540" y="758">+ maskBlockwords(request)</text>

<rect class="card" x="898" y="590" width="318" height="190" rx="6" fill="#ecfdf5" stroke="#059669"/>
<text class="tag" x="1057" y="620" text-anchor="middle">object</text>
<text class="name" x="1057" y="654" text-anchor="middle">JapaneseDictionary</text>
<text class="name" x="1057" y="684" text-anchor="middle">Provider</text>
<line class="sep" x1="898" y1="704" x2="1216" y2="704" stroke="#bbf7d0"/>
<text class="body" x="928" y="734">+ blockWordDictionary</text>
<text class="body" x="928" y="758">+ add / remove / clear</text>

<rect class="card" x="1286" y="590" width="330" height="190" rx="6" fill="#f1f5f9" stroke="#64748b"/>
<text class="tag" x="1451" y="620" text-anchor="middle">lazy runtime state</text>
<text class="name" x="1451" y="654" text-anchor="middle">Blockword Dictionary</text>
<line class="sep" x1="1286" y1="704" x2="1616" y2="704" stroke="#cbd5e1"/>
<text class="body" x="1316" y="734">japanesetext/block/blocks.txt</text>
<text class="body" x="1316" y="758">CharArraySet membership</text>

<rect class="card" x="1190" y="222" width="440" height="170" rx="6" fill="#f5f3ff" stroke="#7c3aed"/>
<text class="tag" x="1410" y="252" text-anchor="middle">TokenBase extensions</text>
<text class="small-name" x="1410" y="286" text-anchor="middle">POS Predicate Helpers</text>
<line class="sep" x1="1190" y1="308" x2="1630" y2="308" stroke="#ddd6fe"/>
<text class="body" x="1222" y="338">isNoun / isVerb / isNounOrVerb</text>
<text class="body" x="1222" y="362">isAdjective / isJosa / isPunctuation</text>

<path class="dep" d="M 392 430 L 450 430 L 450 320 L 508 320" stroke="#2563eb" marker-end="url(#depBlue)"/>
<path class="dep" d="M 392 526 L 450 526 L 450 686 L 510 686" stroke="#7c3aed" marker-end="url(#depPurple)"/>
<path class="dep" d="M 392 562 L 430 562 L 430 842 L 1057 842 L 1057 780" stroke="#059669" marker-end="url(#depGreen)"/>
<path class="dep" d="M 798 286 L 862 286" stroke="#d97706" marker-end="url(#depOrange)"/>
<path class="dep" d="M 798 350 L 830 350 L 830 198 L 1410 198 L 1410 222" stroke="#7c3aed" marker-end="url(#depPurple)"/>
<path class="dep" d="M 669 590 L 669 392" stroke="#2563eb" marker-end="url(#depBlue)"/>
<path class="dep" d="M 828 686 L 898 686" stroke="#059669" marker-end="url(#depGreen)"/>
<path class="dep" d="M 1216 686 L 1286 686" stroke="#059669" marker-end="url(#depGreen)"/>

<rect x="100" y="878" width="1560" height="54" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.1"/>
<text class="footer" x="880" y="912" text-anchor="middle">Blockword search checks noun/verb tokens first, then adjacent noun + noun/verb compounds when no direct token match exists.</text>
</svg>
