<svg xmlns="http://www.w3.org/2000/svg" width="998" height="1986" viewBox="0 0 998 1986" role="img" aria-label="tokenizer korean Class Structure">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="openArrow" markerWidth="10" markerHeight="8" refX="8.5" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 8.5 4 L 1 7" fill="none" stroke="#758297" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="inherit" markerWidth="11" markerHeight="10" refX="9.5" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 1 L 9.5 5 L 0.5 9 Z" fill="#ffffff" stroke="#758297" stroke-width="1.7"/></marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:43px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:15px;font-weight:400;fill:#536273}
    .label{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:25px;font-weight:400;fill:#102033}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
    .strong{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:13px;font-weight:400;fill:#102033}
    .card{stroke-width:2.1;filter:url(#shadow)}.compartment{stroke-width:1.5;fill:none}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#openArrow)}
    .plainLine{stroke:#758297;stroke-width:2.1;fill:none}
    .dashed{stroke:#758297;stroke-width:2.1;stroke-dasharray:7 6;fill:none;marker-end:url(#openArrow)}
    .inheritLine{stroke:#758297;stroke-width:2.2;fill:none;marker-end:url(#inherit)}
    .implLine{stroke:#758297;stroke-width:2.2;stroke-dasharray:8 7;fill:none;marker-end:url(#inherit)}
  </style>
</defs>
<rect class="canvas" width="998" height="1986"/>
<rect class="frame" x="32" y="28" width="934" height="1930" rx="28"/>
<text class="title" x="66" y="82">tokenizer korean Class Structure</text>
<text class="subtitle" x="70" y="118">UML classes from the original Mermaid source</text>
<path class="line" d="M724 740 L724 1188"/>
<path class="line" d="M499 376 L499 455 L724 455 L724 502"/>
<path class="line" d="M499 376 L499 866"/>
<path class="line" d="M274 502 L274 439 L499 439 L499 376"/>
<path class="line" d="M274 1489 L274 1615"/>
<path class="line" d="M274 1188 L274 656"/>
<path class="line" d="M274 1489 L274 1528 L724 1528 L724 1615"/>
<g transform="translate(309,180)">
  <rect class="card" x="0" y="0" width="380" height="196" rx="5" fill="#E8F3FF" stroke="#5B8DEF"/>
  <line class="compartment" x1="0" y1="78" x2="380" y2="78" stroke="#5B8DEF"/>
  <text class="small" x="190" y="26" text-anchor="middle"></text>
  <text class="label" x="190" y="61" text-anchor="middle">KoreanChunker</text>
  <text class="mono" x="18" y="108">+chunk(input) List~KoreanToken~</text>
<text class="mono" x="18" y="129">+getChunks(input, keepSpace) List~String~</text>
<text class="mono" x="18" y="150">+getChunksByPos(input, pos) List~KoreanToken~</text>
<text class="mono" x="18" y="171">+POS_PATTERNS Map~KoreanPos, Pattern~</text>
</g>
<g transform="translate(84,502)">
  <rect class="card" x="0" y="0" width="380" height="154" rx="5" fill="#EAF7EF" stroke="#58A978"/>
  <line class="compartment" x1="0" y1="78" x2="380" y2="78" stroke="#58A978"/>
  <text class="small" x="190" y="26" text-anchor="middle"></text>
  <text class="label" x="190" y="61" text-anchor="middle">KoreanTokenizer</text>
  <text class="mono" x="18" y="108">+tokenize(text, profile) List~KoreanToken~</text>
<text class="mono" x="18" y="129">+tokenizeTopN(text, n, profile) List</text>
</g>
<g transform="translate(534,502)">
  <rect class="card" x="0" y="0" width="380" height="238" rx="5" fill="#FFF3D9" stroke="#D6A441"/>
  <line class="compartment" x1="0" y1="78" x2="380" y2="78" stroke="#D6A441"/>
  <text class="small" x="190" y="26" text-anchor="middle"></text>
  <text class="label" x="190" y="61" text-anchor="middle">KoreanToken</text>
  <text class="mono" x="18" y="108">+text String</text>
<text class="mono" x="18" y="129">+pos KoreanPos</text>
<text class="mono" x="18" y="150">+offset Int</text>
<text class="mono" x="18" y="171">+length Int</text>
<text class="mono" x="18" y="192">+stem String?</text>
<text class="mono" x="18" y="213">+unknown Boolean</text>
</g>
<g transform="translate(309,866)">
  <rect class="card" x="0" y="0" width="380" height="196" rx="5" fill="#FDECEF" stroke="#DC6B82"/>
  <line class="compartment" x1="0" y1="78" x2="380" y2="78" stroke="#DC6B82"/>
  <text class="small" x="190" y="26" text-anchor="middle">«internal»</text>
  <text class="label" x="190" y="61" text-anchor="middle">TwitterCompatPatterns</text>
  <text class="mono" x="18" y="108">+VALID_URL Pattern</text>
<text class="mono" x="18" y="129">+VALID_HASHTAG Pattern</text>
<text class="mono" x="18" y="150">+VALID_MENTION_OR_LIST Pattern</text>
<text class="mono" x="18" y="171">+VALID_CASHTAG Pattern</text>
</g>
<g transform="translate(84,1188)">
  <rect class="card" x="0" y="0" width="380" height="301" rx="5" fill="#E9F7F6" stroke="#45A7A1"/>
  <line class="compartment" x1="0" y1="78" x2="380" y2="78" stroke="#45A7A1"/>
  <text class="small" x="190" y="26" text-anchor="middle"></text>
  <text class="label" x="190" y="61" text-anchor="middle">KoreanProcessor</text>
  <text class="mono" x="18" y="108">+normalize(text) CharSequence</text>
<text class="mono" x="18" y="129">+tokenize(text, profile) List~KoreanToken~</text>
<text class="mono" x="18" y="150">+tokenizeForNoun(text, profile)</text>
<text class="mono" x="18" y="171">List~KoreanToken~</text>
<text class="mono" x="18" y="192">+tokenizeTopN(text, n, profile) List</text>
<text class="mono" x="18" y="213">+extractPhrases(tokens, filterSpam)</text>
<text class="mono" x="18" y="234">List~KoreanPhrase~</text>
<text class="mono" x="18" y="255">+extractPhrasesForNoun(tokens)</text>
<text class="mono" x="18" y="276">List~KoreanPhrase~</text>
</g>
<g transform="translate(534,1188)">
  <rect class="card" x="0" y="0" width="380" height="238" rx="5" fill="#F1ECFF" stroke="#8A72D6"/>
  <line class="compartment" x1="0" y1="78" x2="380" y2="78" stroke="#8A72D6"/>
  <text class="small" x="190" y="26" text-anchor="middle">«enumeration»</text>
  <text class="label" x="190" y="61" text-anchor="middle">KoreanPos</text>
  <text class="mono" x="18" y="108">Noun Verb Adjective Adverb</text>
<text class="mono" x="18" y="129">Josa Eomi PreEomi Suffix</text>
<text class="mono" x="18" y="150">Hashtag ScreenName URL Email</text>
<text class="mono" x="18" y="171">CashTag Number Korean Alpha</text>
<text class="mono" x="18" y="192">KoreanParticle Punctuation Space Foreign</text>
<text class="mono" x="18" y="213">Unknown ProperNoun</text>
</g>
<g transform="translate(84,1615)">
  <rect class="card" x="0" y="0" width="380" height="154" rx="5" fill="#F7F1E7" stroke="#B88A44"/>
  <line class="compartment" x1="0" y1="78" x2="380" y2="78" stroke="#B88A44"/>
  <text class="small" x="190" y="26" text-anchor="middle"></text>
  <text class="label" x="190" y="61" text-anchor="middle">KoreanBlockwordProcessor</text>
  <text class="mono" x="18" y="108">+findBlockwords(text) List~KoreanToken~</text>
<text class="mono" x="18" y="129">+maskBlockwords(request) BlockwordResponse</text>
</g>
<g transform="translate(534,1615)">
  <rect class="card" x="0" y="0" width="380" height="175" rx="5" fill="#EEF6D9" stroke="#8BA84D"/>
  <line class="compartment" x1="0" y1="78" x2="380" y2="78" stroke="#8BA84D"/>
  <text class="small" x="190" y="26" text-anchor="middle"></text>
  <text class="label" x="190" y="61" text-anchor="middle">KoreanNormalizer</text>
  <text class="mono" x="18" y="108">+normalize(input) CharSequence</text>
<text class="mono" x="18" y="129">+correctTypo(chunk) CharSequence</text>
<text class="mono" x="18" y="150">+normalizeCodaN(chunk) CharSequence</text>
</g>
</svg>
