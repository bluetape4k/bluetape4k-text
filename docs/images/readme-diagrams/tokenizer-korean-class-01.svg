<text class="name" x="1666" y="300" text-anchor="middle">KoreanDictionaryProvider</text>
<line class="sep" x1="1472" y1="326" x2="1860" y2="326" stroke="#bbf7d0"/>
<text class="body" x="1504" y="356">+ koreanDictionary: POS -> Set</text>
<text class="body" x="1504" y="382">+ typoDictionaryByLength</text>
<text class="body" x="1504" y="408">+ addWordsToDictionary</text>
<text class="body" x="1504" y="434">protected by ReentrantLock</text>

<rect class="card" x="1472" y="514" width="388" height="174" rx="6" fill="#f1f5f9" stroke="#64748b"/>
