<svg xmlns="http://www.w3.org/2000/svg" width="1960" height="1200" viewBox="0 0 1960 1200" role="img" aria-labelledby="title desc">
<title id="title">tokenizer-korean class contract map</title>
<desc id="desc">Class contract map for KoreanProcessor facade, normalization, tokenization, phrase/stem/sentence utilities, blockword masking, and Korean dictionary provider.</desc>
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
    <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#94a3b8" flood-opacity="0.16"/>
  </filter>
  <marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#2563eb" stroke-dasharray="none"/></marker>
  <marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#d97706" stroke-dasharray="none"/></marker>
  <marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#059669" stroke-dasharray="none"/></marker>
  <marker id="purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#7c3aed" stroke-dasharray="none"/></marker>
  <style>
    .canvas{fill:#f8fafc}.frame{fill:#fff;stroke:#cbd5e1;stroke-width:1.4}
    .group{fill:#f8fafc;stroke:#c6d3e1;stroke-width:1.1}
    .title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:50px;fill:#172033}
    .subtitle,.body,.footer,.tag{font-family:"Comic Mono","Comic Sans MS",sans-serif;fill:#475569}
    .subtitle{font-size:17px}.footer{font-size:14px}.tag{font-size:14px;font-weight:700}
    .name{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:28px;fill:#172033}
    .small-name{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:23px;fill:#172033}
    .body{font-size:15px}.card{filter:url(#shadow);stroke-width:1.3}.sep{stroke-width:1.0}
    .dep{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:7 6}
  </style>
</defs>

<rect class="canvas" width="1960" height="1200" rx="30"/>
<rect class="frame" x="24" y="24" width="1912" height="1152" rx="26"/>
<text class="title" x="60" y="82">tokenizer-korean Class Contract Map</text>
<text class="subtitle" x="62" y="116">KoreanProcessor coordinates normalization, chunking/tokenization, phrase utilities, sentence helpers, blockword masking, and mutable dictionaries.</text>

<rect class="group" x="58" y="152" width="336" height="900" rx="18"/>
<text class="tag" x="86" y="184">FACADE</text>

<rect class="group" x="430" y="152" width="962" height="332" rx="18"/>
<text class="tag" x="458" y="184">NORMALIZE AND TOKENIZE</text>

<rect class="group" x="430" y="520" width="962" height="250" rx="18"/>
<text class="tag" x="458" y="552">PHRASE, STEM, SENTENCE</text>

<rect class="group" x="1430" y="152" width="470" height="618" rx="18"/>
<text class="tag" x="1458" y="184">DICTIONARY OWNERSHIP</text>

<rect class="group" x="430" y="806" width="1470" height="246" rx="18"/>
<text class="tag" x="458" y="838">BLOCKWORD MASKING</text>

<rect class="card" x="92" y="390" width="268" height="286" rx="6" fill="#dbeafe" stroke="#2563eb"/>
