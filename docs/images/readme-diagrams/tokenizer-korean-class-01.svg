<text class="body" x="120" y="568">+ extractPhrases / stem</text>
<text class="body" x="120" y="596">+ split / detokenize</text>
<text class="body" x="120" y="624">+ blockword APIs</text>
<text class="body" x="120" y="652">+ runtime dictionary add</text>

<rect class="card" x="470" y="236" width="214" height="144" rx="6" fill="#fef3c7" stroke="#d97706"/>
