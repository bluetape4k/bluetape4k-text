<svg xmlns="http://www.w3.org/2000/svg" width="1960" height="1654" viewBox="0 0 1960 1654" role="img" aria-label="Search Pipeline">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="openArrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 10 5 L 1 9" fill="none" stroke="#758297" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="inherit" markerWidth="14" markerHeight="12" refX="12" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M 0 1 L 12 6 L 0 11 Z" fill="#ffffff" stroke="#758297" stroke-width="1.8"/></marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:43px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:15px;font-weight:400;fill:#536273}
    .label{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:25px;font-weight:400;fill:#102033}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
    .strong{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:13px;font-weight:400;fill:#102033}
    .card{stroke-width:2.1;filter:url(#shadow)}.compartment{stroke-width:1.5;fill:none}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#openArrow)}
    .plainLine{stroke:#758297;stroke-width:2.1;fill:none}
    .dashed{stroke:#758297;stroke-width:2.1;stroke-dasharray:7 6;fill:none;marker-end:url(#openArrow)}
    .inheritLine{stroke:#758297;stroke-width:2.2;fill:none;marker-end:url(#inherit)}
    .implLine{stroke:#758297;stroke-width:2.2;stroke-dasharray:8 7;fill:none;marker-end:url(#inherit)}
  </style>
</defs>
<rect class="canvas" width="1960" height="1654"/>
<rect class="frame" x="32" y="28" width="1896" height="1598" rx="28"/>
<text class="title" x="66" y="82">Search Pipeline</text>
<text class="subtitle" x="70" y="118">Sequence messages from the original Mermaid source</text>
<rect class="card" x="-10" y="166" width="300" height="72" rx="20" fill="#E8F3FF" stroke="#5B8DEF"/>
<text class="smallLabel" x="140" y="209" text-anchor="middle">Caller</text>
<line class="lifeline" x1="140" y1="252" x2="140" y2="1594" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="410" y="166" width="300" height="72" rx="20" fill="#EAF7EF" stroke="#58A978"/>
<text class="smallLabel" x="560" y="198.5" text-anchor="middle">Aho Corasick</text>
<text class="smallLabel" x="560" y="219.5" text-anchor="middle">Automaton</text>
<line class="lifeline" x1="560" y1="252" x2="560" y2="1594" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="830" y="166" width="300" height="72" rx="20" fill="#FFF3D9" stroke="#D6A441"/>
<text class="smallLabel" x="980" y="209" text-anchor="middle">Normalizers</text>
<line class="lifeline" x1="980" y1="252" x2="980" y2="1594" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="1250" y="166" width="300" height="72" rx="20" fill="#FDECEF" stroke="#DC6B82"/>
<text class="smallLabel" x="1400" y="209" text-anchor="middle">OffsetMapping</text>
<line class="lifeline" x1="1400" y1="252" x2="1400" y2="1594" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="1670" y="166" width="300" height="72" rx="20" fill="#E9F7F6" stroke="#45A7A1"/>
<text class="smallLabel" x="1820" y="209" text-anchor="middle">TrieCore</text>
<line class="lifeline" x1="1820" y1="252" x2="1820" y2="1594" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect x="245" y="286" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="263" y="313" text-anchor="start">1. parseText(text)</text>
<path class="line" d="M140 344 L560 344"/>
<rect x="627" y="396" width="286" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="645" y="423" text-anchor="start">2. applyPipeline(text, options)</text>
<path class="line" d="M560 454 L980 454"/>
<rect x="665" y="506" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="683" y="533" text-anchor="start">3. normalizedText</text>
<path class="dashed" d="M980 564 L560 564"/>
<rect x="756" y="616" width="448" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="774" y="643" text-anchor="start">4. OffsetMapping.build(original, normalizationForm)</text>
<path class="line" d="M560 674 L1400 674"/>
<rect x="849" y="726" width="262" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="867" y="753" text-anchor="start">5. (normalizedText, mapping)</text>
<path class="dashed" d="M1400 784 L560 784"/>
<rect x="1043" y="836" width="294" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1061" y="863" text-anchor="start">6. core.parseText(processedText)</text>
<path class="line" d="M560 894 L1820 894"/>
<rect x="1085" y="946" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1103" y="973" text-anchor="start">7. List~Emit~</text>
<path class="dashed" d="M1820 1004 L560 1004"/>
<rect x="70" y="1056" width="1820" height="40" rx="16" fill="#F7F1E7" stroke="#B88A44" stroke-width="1.6" opacity="0.96"/>
<text class="strong" x="92" y="1083" text-anchor="start">LOOP: for each Emit</text>
<rect x="861" y="1124" width="238" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="879" y="1151" text-anchor="start">9. toOriginal(normOffset)</text>
<path class="line" d="M560 1182 L1400 1182"/>
<rect x="875" y="1234" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="893" y="1261" text-anchor="start">10. origOffset</text>
<path class="dashed" d="M1400 1292 L560 1292"/>
<rect x="485" y="1344" width="246" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="503" y="1371" text-anchor="start">11. build AhoCorasickMatch</text>
<path class="line" d="M560 1402 C624 1402 624 1436 560 1436"/>
<rect x="215" y="1474" width="270" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="233" y="1501" text-anchor="start">12. List~AhoCorasickMatch~V~~</text>
<path class="dashed" d="M560 1532 L140 1532"/>
</svg>
