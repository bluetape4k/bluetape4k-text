<svg xmlns="http://www.w3.org/2000/svg" width="1620" height="1140" viewBox="0 0 1620 1140" role="img" aria-labelledby="title desc">
<title id="title">text-search parse sequence</title>
<desc id="desc">Sequence view for Aho-Corasick parsing, preprocessing, trie scanning, offset restoration, and public result construction.</desc>
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
    <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#94a3b8" flood-opacity="0.16"/>
  </filter>
  <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M 0 0 L 10 5 L 0 10 Z" fill="#2563eb" stroke-dasharray="none"/>
  </marker>
  <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M 0 0 L 10 5 L 0 10 Z" fill="#059669" stroke-dasharray="none"/>
  </marker>
  <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M 0 0 L 10 5 L 0 10 Z" fill="#d97706" stroke-dasharray="none"/>
  </marker>
  <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M 0 0 L 10 5 L 0 10 Z" fill="#64748b" stroke-dasharray="none"/>
  </marker>
  <style>
    .canvas{fill:#f8fafc}
    .frame{fill:#fff;stroke:#cbd5e1;stroke-width:1.4}
    .title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:50px;fill:#172033}
    .subtitle,.body,.tag,.msg{font-family:"Comic Mono","Comic Sans MS",sans-serif;fill:#475569}
    .subtitle{font-size:17px}
    .tag{font-size:14px;font-weight:700}
    .body{font-size:15px}
    .name{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:27px;fill:#172033}
    .small-name{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:23px;fill:#172033}
    .msg{font-size:14px}
    .card{filter:url(#shadow);stroke-width:1.3}
    .lifeline{stroke:#b7c4d2;stroke-width:1.6;stroke-dasharray:9 10}
    .call{fill:none;stroke-width:2.0;stroke-linecap:round;stroke-linejoin:round}
    .return{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:7 7}
    .region{fill:#fff7ed;stroke:#f59e0b;stroke-width:1.2;stroke-dasharray:8 7;opacity:.72}
    .label-bg{fill:#fff;opacity:.96}
  </style>
</defs>

<rect class="canvas" width="1620" height="1140" rx="30"/>
<rect class="frame" x="24" y="24" width="1572" height="1092" rx="26"/>
<text class="title" x="60" y="82">Search Pipeline Sequence</text>
<text class="subtitle" x="62" y="116">A parse request is normalized, scanned by TrieCore, mapped back to original offsets, and shaped into public results.</text>

<rect class="card" x="70" y="164" width="220" height="72" rx="8" fill="#dbeafe" stroke="#2563eb"/>
<text class="name" x="180" y="208" text-anchor="middle">Caller</text>
<line class="lifeline" x1="180" y1="250" x2="180" y2="1060"/>

<rect class="card" x="370" y="164" width="260" height="72" rx="8" fill="#e0f2fe" stroke="#0284c7"/>
<text class="small-name" x="500" y="195" text-anchor="middle">AhoCorasick</text>
<text class="small-name" x="500" y="220" text-anchor="middle">Automaton</text>
<line class="lifeline" x1="500" y1="250" x2="500" y2="1060"/>

<rect class="card" x="710" y="164" width="240" height="72" rx="8" fill="#fef3c7" stroke="#d97706"/>
<text class="name" x="830" y="208" text-anchor="middle">Text Pipeline</text>
<line class="lifeline" x1="830" y1="250" x2="830" y2="1060"/>

<rect class="card" x="1030" y="164" width="240" height="72" rx="8" fill="#fff7ed" stroke="#d97706"/>
<text class="name" x="1150" y="208" text-anchor="middle">TrieCore</text>
<line class="lifeline" x1="1150" y1="250" x2="1150" y2="1060"/>

<rect class="card" x="1360" y="164" width="210" height="72" rx="8" fill="#f1f5f9" stroke="#64748b"/>
<text class="small-name" x="1465" y="195" text-anchor="middle">Offset</text>
<text class="small-name" x="1465" y="220" text-anchor="middle">Mapping</text>
<line class="lifeline" x1="1465" y1="250" x2="1465" y2="1060"/>

<rect class="label-bg" x="252" y="296" width="176" height="26" rx="7"/>
<text class="msg" x="340" y="314" text-anchor="middle">parseText(text)</text>
<path class="call" d="M 180 334 L 500 334" stroke="#2563eb" marker-end="url(#arrowBlue)"/>

<rect class="label-bg" x="558" y="386" width="214" height="26" rx="7"/>
<text class="msg" x="665" y="404" text-anchor="middle">applyPipeline(options)</text>
<path class="call" d="M 500 424 L 830 424" stroke="#d97706" marker-end="url(#arrowOrange)"/>

<rect class="label-bg" x="596" y="476" width="186" height="26" rx="7"/>
<text class="msg" x="689" y="494" text-anchor="middle">processed text</text>
<path class="return" d="M 830 514 L 500 514" stroke="#64748b" marker-end="url(#arrowGray)"/>

<rect class="label-bg" x="654" y="566" width="342" height="26" rx="7"/>
<text class="msg" x="825" y="584" text-anchor="middle">core.parseText(processedText)</text>
<path class="call" d="M 500 604 L 1150 604" stroke="#d97706" marker-end="url(#arrowOrange)"/>

<rect class="label-bg" x="736" y="656" width="178" height="26" rx="7"/>
<text class="msg" x="825" y="674" text-anchor="middle">raw emits</text>
<path class="return" d="M 1150 694 L 500 694" stroke="#64748b" marker-end="url(#arrowGray)"/>

<rect class="region" x="432" y="730" width="1098" height="218" rx="16"/>
<text class="tag" x="456" y="760">FOR EACH EMIT</text>

<rect class="label-bg" x="850" y="786" width="266" height="26" rx="7"/>
<text class="msg" x="983" y="804" text-anchor="middle">toOriginal(start/end)</text>
<path class="call" d="M 500 824 L 1465 824" stroke="#64748b" marker-end="url(#arrowGray)"/>

<rect class="label-bg" x="840" y="870" width="286" height="26" rx="7"/>
<text class="msg" x="983" y="888" text-anchor="middle">original offsets</text>
<path class="return" d="M 1465 908 L 500 908" stroke="#64748b" marker-end="url(#arrowGray)"/>

<rect class="label-bg" x="548" y="984" width="302" height="26" rx="7"/>
<text class="msg" x="699" y="1002" text-anchor="middle">AhoCorasickMatch / tokens / boolean</text>
<path class="return" d="M 500 1022 L 180 1022" stroke="#059669" marker-end="url(#arrowGreen)"/>
</svg>
