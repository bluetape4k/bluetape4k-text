<text class="label" x="274" y="760" text-anchor="middle">Text + keywords</text>
<text class="body" x="150" y="792">dictionary matching</text>

<rect x="560" y="155" width="450" height="686" rx="18" fill="#f8fafc" stroke="#b6c7dc" stroke-width="1.2" stroke-dasharray="8 7"/>
<text class="lane" x="600" y="199">Runtime capability</text>
