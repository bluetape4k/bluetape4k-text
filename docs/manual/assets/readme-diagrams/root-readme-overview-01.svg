<text class="label" x="785" y="592" text-anchor="middle">Language detection</text>
<text class="body" x="656" y="626">Lingua detector DSL</text>
<text class="body" x="656" y="650">Unicode filters</text>
<rect x="620" y="710" width="330" height="120" rx="10" fill="#fff1f2" stroke="#e11d48" stroke-width="1.2" filter="url(#shadow)"/>
<text class="label" x="785" y="752" text-anchor="middle">Aho-Corasick</text>
<text class="body" x="656" y="786">immutable automata</text>
<text class="body" x="656" y="810">replaceAll, Flow matching</text>

<rect x="1120" y="155" width="470" height="686" rx="18" fill="#f8fafc" stroke="#b6c7dc" stroke-width="1.2" stroke-dasharray="8 7"/>
<text class="lane" x="1150" y="199">Output</text>
<rect x="1190" y="240" width="330" height="100" rx="10" fill="#dcfce7" stroke="#059669" stroke-width="1.2" filter="url(#shadow)"/>
<text class="label" x="1355" y="280" text-anchor="middle">Korean tokens</text>
<text class="body" x="1225" y="312">phrases, stems, masks</text>
<rect x="1190" y="400" width="330" height="100" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.2" filter="url(#shadow)"/>
<text class="label" x="1355" y="440" text-anchor="middle">Japanese tokens</text>
<text class="body" x="1225" y="472">nouns, masks</text>
<rect x="1190" y="560" width="330" height="100" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.2" filter="url(#shadow)"/>
<text class="label" x="1355" y="600" text-anchor="middle">Languages</text>
