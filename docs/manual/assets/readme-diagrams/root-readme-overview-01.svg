<rect x="1190" y="720" width="330" height="100" rx="10" fill="#fff1f2" stroke="#e11d48" stroke-width="1.2" filter="url(#shadow)"/>
<text class="label" x="1355" y="760" text-anchor="middle">Matches / masks</text>
<text class="body" x="1225" y="792">offsets, values, replacements</text>

<path class="line" d="M 430 290 L 620 290" stroke="#059669" marker-end="url(#green)"/>
<path class="line" d="M 950 290 L 1190 290" stroke="#059669" marker-end="url(#green)"/>
<path class="line" d="M 430 450 L 620 450" stroke="#d97706" marker-end="url(#amber)"/>
<path class="line" d="M 950 450 L 1190 450" stroke="#d97706" marker-end="url(#amber)"/>
<path class="line" d="M 430 610 L 620 610" stroke="#7c3aed" marker-end="url(#violet)"/>
<path class="line" d="M 950 610 L 1190 610" stroke="#7c3aed" marker-end="url(#violet)"/>
<path class="line" d="M 430 770 L 620 770" stroke="#e11d48" marker-end="url(#rose)"/>
<path class="line" d="M 950 770 L 1190 770" stroke="#e11d48" marker-end="url(#rose)"/>

<text class="footer" x="830" y="910" text-anchor="middle">Root README view: BOM is intentionally omitted; runtime modules are selected by task.</text>
<text class="footer" x="830" y="938" text-anchor="middle">Use the module chart for artifact dependencies; lingua and text-search are independent runtime choices.</text>
</svg>
