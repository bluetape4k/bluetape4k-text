<svg xmlns="http://www.w3.org/2000/svg" width="1660" height="1020" viewBox="0 0 1660 1020" role="img" aria-labelledby="title desc">
<title id="title">bluetape4k-text overview</title>
<desc id="desc">Task-oriented overview of bluetape4k-text runtime choices with direct input to capability to output flows.</desc>
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#94a3b8" flood-opacity="0.20"/></filter>
  <marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#2563eb"/></marker>
  <marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#059669"/></marker>
  <marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#d97706"/></marker>
  <marker id="rose" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#e11d48"/></marker>
  <marker id="violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#7c3aed"/></marker>
  <marker id="cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#0891b2"/></marker>
  <style>
    .title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:52px;fill:#172033}
    .subtitle,.body,.footer{font-family:"Comic Mono","Comic Sans MS",sans-serif;fill:#475569}
    .subtitle{font-size:18px}.body{font-size:18px}.footer{font-size:15px}
    .lane{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:30px;fill:#172033}
    .label{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:32px;fill:#172033}
    .line{fill:none;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
  </style>
</defs>

<rect width="1660" height="1020" rx="30" fill="#f8fafc"/>
<rect x="24" y="24" width="1612" height="972" rx="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/>
<text class="title" x="60" y="82">bluetape4k-text Overview</text>
<text class="subtitle" x="62" y="116">Pick one runtime artifact for the text task: tokenize Korean or Japanese, detect language, or search keywords.</text>

<rect x="70" y="155" width="410" height="686" rx="18" fill="#f8fafc" stroke="#b6c7dc" stroke-width="1.2" stroke-dasharray="8 7"/>
<text class="lane" x="100" y="199">Input</text>
<rect x="118" y="240" width="312" height="100" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2" filter="url(#shadow)"/>
<text class="label" x="274" y="280" text-anchor="middle">Korean text</text>
<text class="body" x="150" y="312">documents, search queries</text>
<rect x="118" y="400" width="312" height="100" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.2" filter="url(#shadow)"/>
<text class="label" x="274" y="440" text-anchor="middle">Japanese text</text>
<text class="body" x="150" y="472">documents, search queries</text>
<rect x="118" y="560" width="312" height="100" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.2" filter="url(#shadow)"/>
<text class="label" x="274" y="600" text-anchor="middle">Unknown language</text>
<text class="body" x="150" y="632">single or mixed content</text>
