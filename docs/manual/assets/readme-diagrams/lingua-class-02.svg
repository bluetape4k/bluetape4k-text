<svg xmlns="http://www.w3.org/2000/svg" width="1754" height="960" viewBox="0 0 1754 960" role="img" aria-label="lingua Class Structure 2">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="openArrow" markerWidth="10" markerHeight="8" refX="8.5" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 8.5 4 L 1 7" fill="none" stroke="#758297" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="inherit" markerWidth="11" markerHeight="10" refX="9.5" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 1 L 9.5 5 L 0.5 9 Z" fill="#ffffff" stroke="#758297" stroke-width="1.7"/></marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:43px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:15px;font-weight:400;fill:#536273}
    .label{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:25px;font-weight:400;fill:#102033}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
    .strong{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:13px;font-weight:400;fill:#102033}
    .card{stroke-width:2.1;filter:url(#shadow)}.compartment{stroke-width:1.5;fill:none}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#openArrow)}
    .plainLine{stroke:#758297;stroke-width:2.1;fill:none}
    .dashed{stroke:#758297;stroke-width:2.1;stroke-dasharray:7 6;fill:none;marker-end:url(#openArrow)}
    .inheritLine{stroke:#758297;stroke-width:2.2;fill:none;marker-end:url(#inherit)}
    .implLine{stroke:#758297;stroke-width:2.2;stroke-dasharray:8 7;fill:none;marker-end:url(#inherit)}
  </style>
</defs>
<rect class="canvas" width="1754" height="960"/>
<rect class="frame" x="32" y="28" width="1690" height="904" rx="28"/>
<text class="title" x="66" y="82">lingua Class Structure 2</text>
<text class="subtitle" x="70" y="118">UML classes from the original Mermaid source</text>
<path class="line" d="M1492 376 L1492 439 L877 439 L877 502"/>
<path class="line" d="M672 334 L672 132 L262 132 L262 180"/>
<path class="line" d="M1082 292 L1082 423 L672 423 L672 180"/>
<g transform="translate(92,180)">
  <rect class="card" x="0" y="0" width="340" height="170" rx="5" fill="#E8F3FF" stroke="#5B8DEF"/>
  <line class="compartment" x1="0" y1="94" x2="340" y2="94" stroke="#5B8DEF"/>
  <text class="small" x="170" y="26" text-anchor="middle">«extensions»</text>
  <text class="label" x="170" y="56.5" text-anchor="middle">Language Detector</text>
<text class="label" x="170" y="81.5" text-anchor="middle">Extensions</text>
  <text class="mono" x="18" y="124">+Language Detector.detect All Languages</text>
<text class="mono" x="18" y="145">Of(text) Set~Language~</text>
</g>
<g transform="translate(502,180)">
  <rect class="card" x="0" y="0" width="340" height="154" rx="5" fill="#EAF7EF" stroke="#58A978"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#58A978"/>
  <text class="small" x="170" y="26" text-anchor="middle"></text>
  <text class="label" x="170" y="61" text-anchor="middle">LanguageDetector</text>
  <text class="mono" x="18" y="108">+detectLanguageOf(text) Language</text>
<text class="mono" x="18" y="129">+computeLanguageConfidenceValues(text) Map</text>
</g>
<g transform="translate(912,180)">
  <rect class="card" x="0" y="0" width="340" height="112" rx="5" fill="#FFF3D9" stroke="#D6A441"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#D6A441"/>
  <text class="small" x="170" y="26" text-anchor="middle"></text>
  <text class="label" x="170" y="61" text-anchor="middle">LanguageDetectorBuilder</text>

</g>
<g transform="translate(1322,180)">
  <rect class="card" x="0" y="0" width="340" height="196" rx="5" fill="#FDECEF" stroke="#DC6B82"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#DC6B82"/>
  <text class="small" x="170" y="26" text-anchor="middle"></text>
  <text class="label" x="170" y="61" text-anchor="middle">UnicodeDetector</text>
  <text class="mono" x="18" y="108">+filterString(text, locale) CharArray</text>
<text class="mono" x="18" y="129">+filterChar(char, locale) Char?</text>
<text class="mono" x="18" y="150">+containsAny(text, locale) Boolean</text>
<text class="mono" x="18" y="171">+containsAll(text, locale) Boolean</text>
</g>
<g transform="translate(707,502)">
  <rect class="card" x="0" y="0" width="340" height="238" rx="5" fill="#E9F7F6" stroke="#45A7A1"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#45A7A1"/>
  <text class="small" x="170" y="26" text-anchor="middle">«extensions»</text>
  <text class="label" x="170" y="61" text-anchor="middle">UnicodeSupport</text>
  <text class="mono" x="18" y="108">+Char.isAscii Boolean</text>
<text class="mono" x="18" y="129">+Char.isLatin Boolean</text>
<text class="mono" x="18" y="150">+Char.isKorean Boolean</text>
<text class="mono" x="18" y="171">+Char.isJapanese Boolean</text>
<text class="mono" x="18" y="192">+Char.isChinese Boolean</text>
<text class="mono" x="18" y="213">+Char.isThai Boolean</text>
</g>
</svg>
