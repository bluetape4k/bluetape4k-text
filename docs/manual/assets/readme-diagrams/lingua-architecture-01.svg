<svg xmlns="http://www.w3.org/2000/svg" width="1580" height="900" viewBox="0 0 1580 900" role="img" aria-labelledby="title desc">
<title id="title">lingua architecture</title>
<desc id="desc">Source-backed architecture of the lingua module: detector factories, mixed-language detection, Unicode filtering, and upstream Lingua engine contracts.</desc>
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
    <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#94a3b8" flood-opacity="0.18"/>
  </filter>
  <marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M 0 0 L 10 5 L 0 10 Z" fill="#2563eb"/>
  </marker>
  <marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M 0 0 L 10 5 L 0 10 Z" fill="#059669"/>
  </marker>
  <marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M 0 0 L 10 5 L 0 10 Z" fill="#d97706"/>
  </marker>
  <marker id="purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M 0 0 L 10 5 L 0 10 Z" fill="#7c3aed"/>
  </marker>
  <style>
    .canvas{fill:#f8fafc}
    .frame{fill:#fff;stroke:#cbd5e1;stroke-width:1.4}
    .band{fill:#f8fafc;stroke:#c6d3e1;stroke-width:1.1;stroke-dasharray:8 7}
    .title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:52px;fill:#172033}
    .subtitle,.body,.footer{font-family:"Comic Mono","Comic Sans MS",sans-serif;fill:#475569}
    .subtitle{font-size:18px}
    .body{font-size:17px}
    .footer{font-size:14px}
    .lane{font-family:"Comic Mono","Comic Sans MS",sans-serif;font-size:15px;font-weight:700;letter-spacing:0;fill:#475569}
    .label{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:30px;fill:#172033}
    .small-label{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:26px;fill:#172033}
    .artifact{font-family:"Comic Mono","Comic Sans MS",sans-serif;font-size:15px;fill:#64748b}
    .card{stroke-width:1.2;filter:url(#shadow)}
    .line{fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  </style>
</defs>

<rect class="canvas" width="1580" height="900" rx="30"/>
<rect class="frame" x="24" y="24" width="1532" height="852" rx="26"/>

<text class="title" x="60" y="82">lingua Architecture</text>
<text class="subtitle" x="62" y="116">Thin Kotlin APIs build reusable Lingua detectors, scan mixed text, and filter Unicode scripts.</text>

<rect class="band" x="70" y="154" width="352" height="682" rx="18"/>
<text class="lane" x="96" y="186">DETECTOR CONSTRUCTION</text>

<rect class="band" x="430" y="154" width="390" height="682" rx="18"/>
<text class="lane" x="456" y="186">MIXED-LANGUAGE DETECTION</text>

<rect class="band" x="840" y="154" width="320" height="682" rx="18"/>
<text class="lane" x="866" y="186">UNICODE FILTERING</text>

<rect class="band" x="1178" y="154" width="322" height="682" rx="18"/>
<text class="lane" x="1204" y="186">SCRIPT PREDICATES</text>

<rect class="card" x="96" y="214" width="300" height="110" rx="10" fill="#dbeafe" stroke="#2563eb"/>
<text class="label" x="246" y="252" text-anchor="middle">Detector DSL</text>
<text class="body" x="128" y="280">allLanguageDetector</text>
<text class="body" x="128" y="302">languageDetectorOf</text>

<rect class="card" x="456" y="214" width="330" height="110" rx="10" fill="#dcfce7" stroke="#059669"/>
<text class="label" x="621" y="252" text-anchor="middle">Mixed text API</text>
<text class="body" x="486" y="280">detectAllLanguagesOf(text)</text>
<text class="body" x="486" y="302">blank input returns emptySet()</text>

<rect class="card" x="860" y="214" width="272" height="110" rx="10" fill="#fef3c7" stroke="#d97706"/>
<text class="label" x="996" y="252" text-anchor="middle">UnicodeDetector</text>
<text class="body" x="886" y="280">filterString / filterChar</text>
<text class="body" x="886" y="302">containsAny / containsAll</text>

<rect class="card" x="1202" y="214" width="284" height="110" rx="10" fill="#ede9fe" stroke="#7c3aed"/>
<text class="label" x="1341" y="252" text-anchor="middle">UnicodeSupport</text>
<text class="body" x="1226" y="280">Char script predicates</text>
<text class="body" x="1226" y="302">isLatin / isKorean / ...</text>

<rect class="card" x="96" y="404" width="300" height="112" rx="10" fill="#eff6ff" stroke="#2563eb"/>
<text class="small-label" x="246" y="442" text-anchor="middle">Builder options</text>
<text class="body" x="128" y="470">preload models, distance</text>
<text class="body" x="128" y="492">low-accuracy mode</text>

<rect class="card" x="456" y="404" width="330" height="112" rx="10" fill="#ecfdf5" stroke="#059669"/>
<text class="small-label" x="621" y="442" text-anchor="middle">Phrase + token scan</text>
<text class="body" x="486" y="470">split sentences, scan letters</text>
<text class="body" x="486" y="492">prefer confident Latin hits</text>

<rect class="card" x="860" y="404" width="272" height="112" rx="10" fill="#fff7ed" stroke="#d97706"/>
<text class="small-label" x="996" y="442" text-anchor="middle">Locale filter</text>
<text class="body" x="886" y="470">ko, ja, en, zh, th</text>
<text class="body" x="886" y="492">ASCII passes supported locales</text>

<rect class="card" x="1202" y="404" width="284" height="112" rx="10" fill="#f5f3ff" stroke="#7c3aed"/>
<text class="small-label" x="1341" y="442" text-anchor="middle">Unicode ranges</text>
<text class="body" x="1226" y="470">Hangul, Kana, CJK</text>
<text class="body" x="1226" y="492">Thai, Latin blocks</text>

<rect class="card" x="96" y="604" width="300" height="100" rx="10" fill="#dbeafe" stroke="#2563eb"/>
<text class="label" x="246" y="644" text-anchor="middle">Lingua builder</text>
<text class="artifact" x="246" y="672" text-anchor="middle">LanguageDetectorBuilder</text>
<text class="artifact" x="246" y="694" text-anchor="middle">all, without, ISO code sets</text>

<rect class="card" x="456" y="604" width="330" height="100" rx="10" fill="#e0f2fe" stroke="#0284c7"/>
<text class="label" x="621" y="644" text-anchor="middle">Reusable detector</text>
<text class="artifact" x="621" y="672" text-anchor="middle">com.github.pemistahl.lingua</text>
<text class="artifact" x="621" y="694" text-anchor="middle">detect + confidence map</text>

<rect class="card" x="456" y="724" width="330" height="82" rx="10" fill="#f0fdf4" stroke="#059669"/>
<text class="label" x="621" y="760" text-anchor="middle">Set&lt;Language&gt;</text>
<text class="artifact" x="621" y="788" text-anchor="middle">all detected languages</text>

<rect class="card" x="860" y="604" width="272" height="100" rx="10" fill="#fff7ed" stroke="#d97706"/>
<text class="label" x="996" y="644" text-anchor="middle">Filtered chars</text>
<text class="artifact" x="996" y="672" text-anchor="middle">CharArray</text>
<text class="artifact" x="996" y="694" text-anchor="middle">Boolean checks</text>

<rect class="card" x="1202" y="604" width="284" height="100" rx="10" fill="#f1f5f9" stroke="#64748b"/>
<text class="label" x="1341" y="644" text-anchor="middle">Supported scripts</text>
<text class="artifact" x="1341" y="672" text-anchor="middle">Latin, Hangul, Kana</text>
<text class="artifact" x="1341" y="694" text-anchor="middle">CJK, Thai, Arabic helpers</text>

<path class="line" d="M 246 324 L 246 404" stroke="#2563eb" marker-end="url(#blue)"/>
<path class="line" d="M 246 516 L 246 604" stroke="#2563eb" marker-end="url(#blue)"/>
<path class="line" d="M 396 654 L 456 654" stroke="#2563eb" marker-end="url(#blue)"/>

<path class="line" d="M 621 324 L 621 404" stroke="#059669" marker-end="url(#green)"/>
<path class="line" d="M 621 516 L 621 604" stroke="#059669" marker-end="url(#green)"/>
<path class="line" d="M 621 704 L 621 724" stroke="#059669" marker-end="url(#green)"/>

<path class="line" d="M 996 324 L 996 404" stroke="#d97706" marker-end="url(#orange)"/>
<path class="line" d="M 996 516 L 996 604" stroke="#d97706" marker-end="url(#orange)"/>
<path class="line" d="M 1132 450 L 1202 450" stroke="#d97706" marker-end="url(#orange)"/>

<path class="line" d="M 1341 324 L 1341 404" stroke="#7c3aed" marker-end="url(#purple)"/>
<path class="line" d="M 1341 516 L 1341 604" stroke="#7c3aed" marker-end="url(#purple)"/>

<text class="footer" x="790" y="856" text-anchor="middle">Reuse detector instances; model loading is expensive, and mixed-language fallback keeps unknown input empty.</text>
</svg>
