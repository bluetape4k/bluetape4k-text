<svg xmlns="http://www.w3.org/2000/svg" width="1580" height="960" viewBox="0 0 1580 960" role="img" aria-labelledby="title desc">
<title id="title">bluetape4k-text BOM architecture</title>
<desc id="desc">Static view of the bluetape4k-text BOM as a Gradle java-platform publication that exports dependency constraints for runtime artifacts.</desc>
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
    <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#94a3b8" flood-opacity="0.20"/>
  </filter>
  <marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M 0 0 L 10 5 L 0 10 Z" fill="#2563eb"/>
  </marker>
  <marker id="cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M 0 0 L 10 5 L 0 10 Z" fill="#0891b2"/>
  </marker>
  <marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M 0 0 L 10 5 L 0 10 Z" fill="#059669"/>
  </marker>
  <style>
    .title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:52px;fill:#172033}
    .subtitle,.body,.footer{font-family:"Comic Mono","Comic Sans MS",sans-serif;fill:#475569}
    .subtitle{font-size:18px}.body{font-size:18px}.footer{font-size:15px}
    .lane{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:30px;fill:#172033}
    .label{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:32px;fill:#172033}
    .artifact{font-family:"Comic Mono","Comic Sans MS",sans-serif;font-size:16px;fill:#64748b}
    .line{fill:none;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
  </style>
</defs>

<rect width="1580" height="960" rx="30" fill="#f8fafc"/>
<rect x="24" y="24" width="1532" height="912" rx="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/>
<text class="title" x="60" y="82">bluetape4k-text BOM Architecture</text>
<text class="subtitle" x="62" y="116">The BOM publishes dependency constraints only. Runtime APIs come from the selected text artifacts.</text>

<rect x="70" y="160" width="360" height="610" rx="18" fill="#f8fafc" stroke="#b6c7dc" stroke-width="1.2" stroke-dasharray="8 7"/>
<text class="lane" x="100" y="204">Gradle platform</text>
<rect x="112" y="286" width="276" height="118" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2" filter="url(#shadow)"/>
<text class="label" x="250" y="328" text-anchor="middle">java-platform</text>
<text class="body" x="145" y="362">constraints block</text>
<text class="body" x="145" y="386">no runtime classes</text>
<rect x="112" y="526" width="276" height="118" rx="10" fill="#ecfeff" stroke="#0891b2" stroke-width="1.2" filter="url(#shadow)"/>
<text class="label" x="250" y="568" text-anchor="middle">Subprojects</text>
<text class="body" x="145" y="602">all text modules</text>
<text class="body" x="145" y="626">except the BOM</text>

<rect x="520" y="160" width="460" height="610" rx="18" fill="#f8fafc" stroke="#b6c7dc" stroke-width="1.2" stroke-dasharray="8 7"/>
<text class="lane" x="550" y="204">Published artifact</text>
<rect x="555" y="286" width="390" height="138" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2" filter="url(#shadow)"/>
<text class="label" x="750" y="328" text-anchor="middle">bluetape4k-text-bom</text>
<text class="artifact" x="750" y="356" text-anchor="middle">io.github.bluetape4k.text</text>
<text class="artifact" x="750" y="380" text-anchor="middle">bluetape4k-text-bom</text>
<rect x="555" y="526" width="390" height="118" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2" filter="url(#shadow)"/>
<text class="label" x="750" y="568" text-anchor="middle">Dependency constraints</text>
<text class="body" x="608" y="602">version alignment</text>
<text class="body" x="608" y="626">no runtime APIs</text>

<rect x="1070" y="160" width="440" height="610" rx="18" fill="#f8fafc" stroke="#b6c7dc" stroke-width="1.2" stroke-dasharray="8 7"/>
<text class="lane" x="1100" y="204">Managed runtime artifacts</text>
<rect x="1128" y="240" width="304" height="78" rx="10" fill="#ecfeff" stroke="#0891b2" stroke-width="1.2" filter="url(#shadow)"/>
<text class="label" x="1280" y="290" text-anchor="middle">tokenizer-core</text>
<rect x="1128" y="350" width="304" height="78" rx="10" fill="#dcfce7" stroke="#059669" stroke-width="1.2" filter="url(#shadow)"/>
<text class="label" x="1280" y="400" text-anchor="middle">tokenizer-korean</text>
<rect x="1128" y="460" width="304" height="78" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.2" filter="url(#shadow)"/>
<text class="label" x="1280" y="510" text-anchor="middle">tokenizer-japanese</text>
<rect x="1128" y="570" width="304" height="78" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.2" filter="url(#shadow)"/>
<text class="label" x="1280" y="620" text-anchor="middle">lingua</text>
<rect x="1128" y="680" width="304" height="78" rx="10" fill="#fff1f2" stroke="#e11d48" stroke-width="1.2" filter="url(#shadow)"/>
<text class="label" x="1280" y="730" text-anchor="middle">text-search</text>

<rect x="500" y="810" width="500" height="92" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2" filter="url(#shadow)"/>
<text class="label" x="750" y="846" text-anchor="middle">bluetape4k-dependencies</text>
<text class="body" x="750" y="872" text-anchor="middle">aggregates this BOM</text>
<text class="body" x="750" y="895" text-anchor="middle">with other bluetape4k ecosystems</text>

<path class="line" d="M 388 345 L 555 345" stroke="#2563eb" marker-end="url(#blue)"/>
<path class="line" d="M 388 585 L 555 585" stroke="#0891b2" marker-end="url(#cyan)"/>
<path class="line" d="M 945 585 L 1070 585" stroke="#059669" marker-end="url(#green)"/>
<path class="line" d="M 750 644 L 750 810" stroke="#2563eb" stroke-dasharray="7 6" marker-end="url(#blue)"/>

<text class="footer" x="790" y="920" text-anchor="middle">Import the BOM for versions; add runtime artifacts separately for tokenizer, language detection, or search APIs.</text>
</svg>
