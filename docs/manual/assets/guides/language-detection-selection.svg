<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="title desc">
  <title id="title">Language detection selection</title>
  <desc id="desc">Detection informs routing; the application still owns the policy.</desc>
  <defs>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
    <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000814" flood-opacity="0.42"/>
  </filter>
  <marker id="arrow-cyan-14" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 10 10">
  <path d="M 0 0 L 10 5 L 0 10 Z" fill="#55c7e8" stroke="#55c7e8" stroke-width="0.6"/>
</marker>

<marker id="arrow-teal-14" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 10 10">
  <path d="M 0 0 L 10 5 L 0 10 Z" fill="#5ed6bd" stroke="#5ed6bd" stroke-width="0.6"/>
</marker>

<marker id="arrow-purple-14" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 10 10">
  <path d="M 0 0 L 10 5 L 0 10 Z" fill="#b69af5" stroke="#b69af5" stroke-width="0.6"/>
</marker>

<marker id="arrow-amber-14" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 10 10">
  <path d="M 0 0 L 10 5 L 0 10 Z" fill="#e7b85c" stroke="#e7b85c" stroke-width="0.6"/>
</marker>

<marker id="arrow-rose-14" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 10 10">
  <path d="M 0 0 L 10 5 L 0 10 Z" fill="#ef8297" stroke="#ef8297" stroke-width="0.6"/>
</marker>

<marker id="arrow-olive-14" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 10 10">
  <path d="M 0 0 L 10 5 L 0 10 Z" fill="#9fbd72" stroke="#9fbd72" stroke-width="0.6"/>
</marker>

</defs>

  <rect width="1600" height="1040" fill="#07111f"/>
  <rect class="frame" x="36" y="32" width="1528" height="976" rx="32" fill="none" stroke="#31506c" stroke-width="2"/>
  <text class="title" x="76" y="92" text-anchor="start" font-family="Architects Daughter, monospace" font-size="42" font-weight="700" fill="#eef6ff">Language detection selection</text>
  <text class="subtitle" x="78" y="128" text-anchor="start" font-family="Comic Mono, monospace" font-size="18" font-weight="400" fill="#a9bfd2">Detection informs routing; the application still owns the policy.</text>
  <path class="connector" data-source="contract" data-target="known" d="M 700 310 V 350 Q 700 364 686 364 H 369 Q 355 364 355 378 V 420" fill="none" stroke="#55c7e8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-cyan-14)"/>
<path class="connector" data-source="contract" data-target="unknown" d="M 900 310 V 350 Q 900 364 914 364 H 1231 Q 1245 364 1245 378 V 420" fill="none" stroke="#b69af5" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-purple-14)"/>
<path class="connector" data-source="known" data-target="direct" d="M 355 550 V 700" fill="none" stroke="#5ed6bd" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal-14)"/>
<path class="connector" data-source="unknown" data-target="detected" d="M 1245 550 V 650" fill="none" stroke="#b69af5" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-purple-14)"/>
<path class="connector" data-source="detected" data-target="policy" d="M 1070 715 H 1000" fill="none" stroke="#e7b85c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-amber-14)"/>
<path class="connector" data-source="policy" data-target="selected" d="M 825 780 V 850" fill="none" stroke="#9fbd72" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-olive-14)"/>
<path class="connector" data-source="direct" data-target="selected" d="M 530 765 H 600 Q 614 765 614 779 V 886 Q 614 900 628 900 H 650" fill="none" stroke="#5ed6bd" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal-14)"/>
<g class="card-group" data-card="Start with the service contract">
  <rect class="card" x="600" y="180" width="400" height="130" rx="20" fill="#11263b" stroke="#55c7e8" stroke-width="2.5"/>
  <text x="800.0" y="219" text-anchor="middle" font-family="Architects Daughter, monospace" font-size="23" font-weight="700" fill="#eef6ff">Start with the service contract</text>
  <text x="800.0" y="250" text-anchor="middle" font-family="Comic Mono, monospace" font-size="16" font-weight="400" fill="#a9bfd2">Is the endpoint already language-specific?</text>
</g>

<g class="card-group" data-card="Language is known">
  <rect class="card" x="180" y="420" width="350" height="130" rx="20" fill="#11263b" stroke="#55c7e8" stroke-width="2.5"/>
  <text x="205" y="459" text-anchor="start" font-family="Architects Daughter, monospace" font-size="23" font-weight="700" fill="#eef6ff">Language is known</text>
  <text x="205" y="490" text-anchor="start" font-family="Comic Mono, monospace" font-size="16" font-weight="400" fill="#a9bfd2">skip detection</text>
<text x="205" y="513" text-anchor="start" font-family="Comic Mono, monospace" font-size="16" font-weight="400" fill="#a9bfd2">validate and call directly</text>
</g>

<g class="card-group" data-card="Language is unknown">
  <rect class="card" x="1070" y="420" width="350" height="130" rx="20" fill="#11263b" stroke="#b69af5" stroke-width="2.5"/>
  <text x="1095" y="459" text-anchor="start" font-family="Architects Daughter, monospace" font-size="22" font-weight="700" fill="#eef6ff">Language is unknown</text>
  <text x="1095" y="490" text-anchor="start" font-family="Comic Mono, monospace" font-size="16" font-weight="400" fill="#a9bfd2">inspect Unicode scripts</text>
<text x="1095" y="513" text-anchor="start" font-family="Comic Mono, monospace" font-size="16" font-weight="400" fill="#a9bfd2">use Lingua when confidence matters</text>
</g>

<g class="card-group" data-card="Direct processor">
  <rect class="card" x="180" y="700" width="350" height="130" rx="20" fill="#11263b" stroke="#5ed6bd" stroke-width="2.5"/>
  <text x="205" y="739" text-anchor="start" font-family="Architects Daughter, monospace" font-size="23" font-weight="700" fill="#eef6ff">Direct processor</text>
  <text x="205" y="770" text-anchor="start" font-family="Comic Mono, monospace" font-size="16" font-weight="400" fill="#a9bfd2">KoreanProcessor</text>
<text x="205" y="793" text-anchor="start" font-family="Comic Mono, monospace" font-size="16" font-weight="400" fill="#a9bfd2">JapaneseProcessor</text>
</g>

<g class="card-group" data-card="Detected languages">
  <rect class="card" x="1070" y="650" width="350" height="130" rx="20" fill="#11263b" stroke="#e7b85c" stroke-width="2.5"/>
  <text x="1095" y="689" text-anchor="start" font-family="Architects Daughter, monospace" font-size="23" font-weight="700" fill="#eef6ff">Detected languages</text>
  <text x="1095" y="720" text-anchor="start" font-family="Comic Mono, monospace" font-size="16" font-weight="400" fill="#a9bfd2">evidence, not an instruction</text>
<text x="1095" y="743" text-anchor="start" font-family="Comic Mono, monospace" font-size="16" font-weight="400" fill="#a9bfd2">ambiguous sets are possible</text>
</g>

<g class="card-group" data-card="Routing policy">
  <rect class="card" x="650" y="650" width="350" height="130" rx="20" fill="#11263b" stroke="#9fbd72" stroke-width="2.5"/>
  <text x="675" y="689" text-anchor="start" font-family="Architects Daughter, monospace" font-size="23" font-weight="700" fill="#eef6ff">Routing policy</text>
  <text x="675" y="720" text-anchor="start" font-family="Comic Mono, monospace" font-size="16" font-weight="400" fill="#a9bfd2">supported languages</text>
<text x="675" y="743" text-anchor="start" font-family="Comic Mono, monospace" font-size="16" font-weight="400" fill="#a9bfd2">fallback and ambiguity rules</text>
</g>

<g class="card-group" data-card="Selected processor">
  <rect class="card" x="650" y="850" width="350" height="100" rx="20" fill="#11263b" stroke="#5ed6bd" stroke-width="2.5"/>
  <text x="675" y="889" text-anchor="start" font-family="Architects Daughter, monospace" font-size="23" font-weight="700" fill="#eef6ff">Selected processor</text>
  <text x="675" y="920" text-anchor="start" font-family="Comic Mono, monospace" font-size="16" font-weight="400" fill="#a9bfd2">one intentional execution path</text>
</g>


  <text x="1520" y="980" text-anchor="end" font-family="Comic Mono, monospace" font-size="15" font-weight="400" fill="#7892aa">bluetape4k-text 0.3.0</text>
</svg>
