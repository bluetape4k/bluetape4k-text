<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="title desc">
  <title id="title">Text processing pipeline</title>
  <desc id="desc">Compose only the stages required by the request contract.</desc>
  <defs>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
    <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000814" flood-opacity="0.42"/>
  </filter>
  <marker id="arrow-cyan-14" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 10 10">
  <path d="M 0 0 L 10 5 L 0 10 Z" fill="#55c7e8" stroke="#55c7e8" stroke-width="0.6"/>
</marker>

<marker id="arrow-teal-14" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 10 10">
  <path d="M 0 0 L 10 5 L 0 10 Z" fill="#5ed6bd" stroke="#5ed6bd" stroke-width="0.6"/>
</marker>

<marker id="arrow-purple-14" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 10 10">
  <path d="M 0 0 L 10 5 L 0 10 Z" fill="#b69af5" stroke="#b69af5" stroke-width="0.6"/>
</marker>

<marker id="arrow-amber-14" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 10 10">
  <path d="M 0 0 L 10 5 L 0 10 Z" fill="#e7b85c" stroke="#e7b85c" stroke-width="0.6"/>
</marker>

<marker id="arrow-rose-14" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 10 10">
  <path d="M 0 0 L 10 5 L 0 10 Z" fill="#ef8297" stroke="#ef8297" stroke-width="0.6"/>
</marker>

<marker id="arrow-olive-14" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 10 10">
  <path d="M 0 0 L 10 5 L 0 10 Z" fill="#9fbd72" stroke="#9fbd72" stroke-width="0.6"/>
</marker>

</defs>

  <rect width="1600" height="1040" fill="#07111f"/>
  <rect class="frame" x="36" y="32" width="1528" height="976" rx="32" fill="none" stroke="#31506c" stroke-width="2"/>
  <text class="title" x="76" y="92" text-anchor="start" font-family="Architects Daughter, monospace" font-size="42" font-weight="700" fill="#eef6ff">Text processing pipeline</text>
  <text class="subtitle" x="78" y="128" text-anchor="start" font-family="Comic Mono, monospace" font-size="18" font-weight="400" fill="#a9bfd2">Compose only the stages required by the request contract.</text>
  <path class="connector" data-source="input" data-target="guard" d="M 390 318 H 450" fill="none" stroke="#55c7e8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-cyan-14)"/>
<path class="connector" data-source="guard" data-target="detect" d="M 750 318 H 810" fill="none" stroke="#e7b85c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-amber-14)"/>
<path class="connector" data-source="detect" data-target="route" d="M 1110 318 H 1170" fill="none" stroke="#b69af5" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-purple-14)"/>
<path class="connector" data-source="route" data-target="tokenize" d="M 1320 406 V 574" fill="none" stroke="#5ed6bd" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal-14)"/>
<path class="connector" data-source="tokenize" data-target="enrich" d="M 1170 664 H 1020" fill="none" stroke="#9fbd72" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-olive-14)"/>
<path class="connector" data-source="enrich" data-target="result" d="M 720 664 H 570" fill="none" stroke="#ef8297" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-rose-14)"/>
<g class="card-group" data-card="1 · Accept input">
  <rect class="card" x="90" y="230" width="300" height="176" rx="20" fill="#11263b" stroke="#55c7e8" stroke-width="2.5"/>
  <text x="115" y="269" text-anchor="start" font-family="Architects Daughter, monospace" font-size="23" font-weight="700" fill="#eef6ff">1 · Accept input</text>
  <text x="115" y="300" text-anchor="start" font-family="Comic Mono, monospace" font-size="16" font-weight="400" fill="#a9bfd2">untrusted text</text>
<text x="115" y="323" text-anchor="start" font-family="Comic Mono, monospace" font-size="16" font-weight="400" fill="#a9bfd2">request metadata</text>
</g>

<g class="card-group" data-card="2 · Guard">
  <rect class="card" x="450" y="230" width="300" height="176" rx="20" fill="#11263b" stroke="#e7b85c" stroke-width="2.5"/>
  <text x="475" y="269" text-anchor="start" font-family="Architects Daughter, monospace" font-size="23" font-weight="700" fill="#eef6ff">2 · Guard</text>
  <text x="475" y="300" text-anchor="start" font-family="Comic Mono, monospace" font-size="16" font-weight="400" fill="#a9bfd2">non-blank</text>
<text x="475" y="323" text-anchor="start" font-family="Comic Mono, monospace" font-size="16" font-weight="400" fill="#a9bfd2">length &lt;= 100,000</text>
</g>

<g class="card-group" data-card="3 · Detect if needed">
  <rect class="card" x="810" y="230" width="300" height="176" rx="20" fill="#11263b" stroke="#b69af5" stroke-width="2.5"/>
  <text x="835" y="269" text-anchor="start" font-family="Architects Daughter, monospace" font-size="23" font-weight="700" fill="#eef6ff">3 · Detect if needed</text>
  <text x="835" y="300" text-anchor="start" font-family="Comic Mono, monospace" font-size="16" font-weight="400" fill="#a9bfd2">Unicode script first</text>
<text x="835" y="323" text-anchor="start" font-family="Comic Mono, monospace" font-size="16" font-weight="400" fill="#a9bfd2">Lingua for confidence</text>
</g>

<g class="card-group" data-card="4 · Route">
  <rect class="card" x="1170" y="230" width="300" height="176" rx="20" fill="#11263b" stroke="#5ed6bd" stroke-width="2.5"/>
  <text x="1195" y="269" text-anchor="start" font-family="Architects Daughter, monospace" font-size="23" font-weight="700" fill="#eef6ff">4 · Route</text>
  <text x="1195" y="300" text-anchor="start" font-family="Comic Mono, monospace" font-size="16" font-weight="400" fill="#a9bfd2">one explicit policy</text>
<text x="1195" y="323" text-anchor="start" font-family="Comic Mono, monospace" font-size="16" font-weight="400" fill="#a9bfd2">do not call everything</text>
</g>

<g class="card-group" data-card="5 · Tokenize">
  <rect class="card" x="1170" y="574" width="300" height="180" rx="20" fill="#11263b" stroke="#5ed6bd" stroke-width="2.5"/>
  <text x="1195" y="613" text-anchor="start" font-family="Architects Daughter, monospace" font-size="23" font-weight="700" fill="#eef6ff">5 · Tokenize</text>
  <text x="1195" y="644" text-anchor="start" font-family="Comic Mono, monospace" font-size="16" font-weight="400" fill="#a9bfd2">Korean or Japanese</text>
<text x="1195" y="667" text-anchor="start" font-family="Comic Mono, monospace" font-size="16" font-weight="400" fill="#a9bfd2">processor facade</text>
</g>

<g class="card-group" data-card="6 · Enrich">
  <rect class="card" x="720" y="574" width="300" height="180" rx="20" fill="#11263b" stroke="#9fbd72" stroke-width="2.5"/>
  <text x="745" y="613" text-anchor="start" font-family="Architects Daughter, monospace" font-size="23" font-weight="700" fill="#eef6ff">6 · Enrich</text>
  <text x="745" y="644" text-anchor="start" font-family="Comic Mono, monospace" font-size="16" font-weight="400" fill="#a9bfd2">dictionary filtering</text>
<text x="745" y="667" text-anchor="start" font-family="Comic Mono, monospace" font-size="16" font-weight="400" fill="#a9bfd2">multi-pattern search</text>
</g>

<g class="card-group" data-card="7 · Return result">
  <rect class="card" x="270" y="574" width="300" height="180" rx="20" fill="#11263b" stroke="#ef8297" stroke-width="2.5"/>
  <text x="295" y="613" text-anchor="start" font-family="Architects Daughter, monospace" font-size="23" font-weight="700" fill="#eef6ff">7 · Return result</text>
  <text x="295" y="644" text-anchor="start" font-family="Comic Mono, monospace" font-size="16" font-weight="400" fill="#a9bfd2">stable response shape</text>
<text x="295" y="667" text-anchor="start" font-family="Comic Mono, monospace" font-size="16" font-weight="400" fill="#a9bfd2">no raw-text leakage</text>
</g>

<g class="label-pill">
  <rect x="90" y="872" width="276" height="34" rx="17" fill="#07111f" stroke="#b69af5" stroke-width="2"/>
  <text x="228.0" y="895" text-anchor="middle" font-family="Comic Mono, monospace" font-size="14" font-weight="700" fill="#b69af5">Optional stages stay optional</text>
</g>


  <text x="1520" y="980" text-anchor="end" font-family="Comic Mono, monospace" font-size="15" font-weight="400" fill="#7892aa">bluetape4k-text 0.3.0</text>
</svg>
