<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="title desc">
  <title id="title">Request safety boundary</title>
  <desc id="desc">Validate before dictionaries, tokenizers, or language models see the text.</desc>
  <defs>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
    <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000814" flood-opacity="0.42"/>
  </filter>
  <marker id="arrow-cyan-14" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 10 10">
  <path d="M 0 0 L 10 5 L 0 10 Z" fill="#55c7e8" stroke="#55c7e8" stroke-width="0.6"/>
</marker>

<marker id="arrow-teal-14" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 10 10">
  <path d="M 0 0 L 10 5 L 0 10 Z" fill="#5ed6bd" stroke="#5ed6bd" stroke-width="0.6"/>
</marker>

<marker id="arrow-purple-14" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 10 10">
  <path d="M 0 0 L 10 5 L 0 10 Z" fill="#b69af5" stroke="#b69af5" stroke-width="0.6"/>
</marker>

<marker id="arrow-amber-14" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 10 10">
  <path d="M 0 0 L 10 5 L 0 10 Z" fill="#e7b85c" stroke="#e7b85c" stroke-width="0.6"/>
</marker>

<marker id="arrow-rose-14" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 10 10">
  <path d="M 0 0 L 10 5 L 0 10 Z" fill="#ef8297" stroke="#ef8297" stroke-width="0.6"/>
</marker>

<marker id="arrow-olive-14" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 10 10">
  <path d="M 0 0 L 10 5 L 0 10 Z" fill="#9fbd72" stroke="#9fbd72" stroke-width="0.6"/>
</marker>

</defs>

  <rect width="1600" height="1040" fill="#07111f"/>
  <rect class="frame" x="36" y="32" width="1528" height="976" rx="32" fill="none" stroke="#31506c" stroke-width="2"/>
  <text class="title" x="76" y="92" text-anchor="start" font-family="Architects Daughter, monospace" font-size="42" font-weight="700" fill="#eef6ff">Request safety boundary</text>
  <text class="subtitle" x="78" y="128" text-anchor="start" font-family="Comic Mono, monospace" font-size="18" font-weight="400" fill="#a9bfd2">Validate before dictionaries, tokenizers, or language models see the text.</text>
  <path class="connector" data-source="input" data-target="request" d="M 360 318 H 430" fill="none" stroke="#55c7e8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-cyan-14)"/>
<path class="connector" data-source="request" data-target="blank" d="M 710 318 H 780" fill="none" stroke="#e7b85c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-amber-14)"/>
<path class="connector" data-source="blank" data-target="length" d="M 1060 318 H 1130" fill="none" stroke="#e7b85c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-amber-14)"/>
<path class="connector" data-source="length" data-target="processor" d="M 1270 406 V 600" fill="none" stroke="#5ed6bd" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal-14)"/>
<path class="connector" data-source="processor" data-target="result" d="M 1130 688 H 1000" fill="none" stroke="#9fbd72" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-olive-14)"/>
<path class="connector" data-source="blank" data-target="reject" d="M 920 406 V 470 Q 920 484 906 484 H 530 Q 516 484 516 498 V 790" fill="none" stroke="#ef8297" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-rose-14)"/>
<path class="connector" data-source="length" data-target="reject" d="M 1270 406 V 510 Q 1270 524 1256 524 H 572 Q 558 524 558 538 V 790" fill="none" stroke="#e7b85c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-amber-14)"/>
<g class="card-group" data-card="Untrusted input">
  <rect class="card" x="80" y="230" width="280" height="176" rx="20" fill="#11263b" stroke="#55c7e8" stroke-width="2.5"/>
  <text x="105" y="269" text-anchor="start" font-family="Architects Daughter, monospace" font-size="23" font-weight="700" fill="#eef6ff">Untrusted input</text>
  <text x="105" y="300" text-anchor="start" font-family="Comic Mono, monospace" font-size="16" font-weight="400" fill="#a9bfd2">raw request text</text>
<text x="105" y="323" text-anchor="start" font-family="Comic Mono, monospace" font-size="16" font-weight="400" fill="#a9bfd2">never log the body</text>
</g>

<g class="card-group" data-card="Request model">
  <rect class="card" x="430" y="230" width="280" height="176" rx="20" fill="#11263b" stroke="#e7b85c" stroke-width="2.5"/>
  <text x="455" y="269" text-anchor="start" font-family="Architects Daughter, monospace" font-size="23" font-weight="700" fill="#eef6ff">Request model</text>
  <text x="455" y="300" text-anchor="start" font-family="Comic Mono, monospace" font-size="16" font-weight="400" fill="#a9bfd2">construct at boundary</text>
<text x="455" y="323" text-anchor="start" font-family="Comic Mono, monospace" font-size="16" font-weight="400" fill="#a9bfd2">fail before heavy work</text>
</g>

<g class="card-group" data-card="Non-blank check">
  <rect class="card" x="780" y="230" width="280" height="176" rx="20" fill="#11263b" stroke="#e7b85c" stroke-width="2.5"/>
  <text x="805" y="269" text-anchor="start" font-family="Architects Daughter, monospace" font-size="23" font-weight="700" fill="#eef6ff">Non-blank check</text>
  <text x="805" y="300" text-anchor="start" font-family="Comic Mono, monospace" font-size="16" font-weight="400" fill="#a9bfd2">reject empty meaning</text>
<text x="805" y="323" text-anchor="start" font-family="Comic Mono, monospace" font-size="16" font-weight="400" fill="#a9bfd2">no tokenizer call</text>
</g>

<g class="card-group" data-card="Length check">
  <rect class="card" x="1130" y="230" width="280" height="176" rx="20" fill="#11263b" stroke="#e7b85c" stroke-width="2.5"/>
  <text x="1155" y="269" text-anchor="start" font-family="Architects Daughter, monospace" font-size="23" font-weight="700" fill="#eef6ff">Length check</text>
  <text x="1155" y="300" text-anchor="start" font-family="Comic Mono, monospace" font-size="16" font-weight="400" fill="#a9bfd2">maximum 100,000 chars</text>
<text x="1155" y="323" text-anchor="start" font-family="Comic Mono, monospace" font-size="16" font-weight="400" fill="#a9bfd2">tokenize + blockword</text>
</g>

<g class="card-group" data-card="Processor">
  <rect class="card" x="1130" y="600" width="280" height="176" rx="20" fill="#11263b" stroke="#5ed6bd" stroke-width="2.5"/>
  <text x="1155" y="639" text-anchor="start" font-family="Architects Daughter, monospace" font-size="23" font-weight="700" fill="#eef6ff">Processor</text>
  <text x="1155" y="670" text-anchor="start" font-family="Comic Mono, monospace" font-size="16" font-weight="400" fill="#a9bfd2">tokenizer / dictionary</text>
<text x="1155" y="693" text-anchor="start" font-family="Comic Mono, monospace" font-size="16" font-weight="400" fill="#a9bfd2">model work starts here</text>
</g>

<g class="card-group" data-card="Safe result">
  <rect class="card" x="720" y="600" width="280" height="176" rx="20" fill="#11263b" stroke="#9fbd72" stroke-width="2.5"/>
  <text x="745" y="639" text-anchor="start" font-family="Architects Daughter, monospace" font-size="23" font-weight="700" fill="#eef6ff">Safe result</text>
  <text x="745" y="670" text-anchor="start" font-family="Comic Mono, monospace" font-size="16" font-weight="400" fill="#a9bfd2">stable response shape</text>
<text x="745" y="693" text-anchor="start" font-family="Comic Mono, monospace" font-size="16" font-weight="400" fill="#a9bfd2">bounded metadata</text>
</g>

<g class="card-group" data-card="Reject at the edge">
  <rect class="card" x="250" y="790" width="320" height="150" rx="20" fill="#11263b" stroke="#ef8297" stroke-width="2.5"/>
  <text x="275" y="829" text-anchor="start" font-family="Architects Daughter, monospace" font-size="23" font-weight="700" fill="#eef6ff">Reject at the edge</text>
  <text x="275" y="860" text-anchor="start" font-family="Comic Mono, monospace" font-size="16" font-weight="400" fill="#a9bfd2">400 blank / 413 oversized</text>
<text x="275" y="883" text-anchor="start" font-family="Comic Mono, monospace" font-size="16" font-weight="400" fill="#a9bfd2">redacted message + metrics</text>
</g>

<g class="label-pill">
  <rect x="650" y="884" width="210" height="34" rx="17" fill="#07111f" stroke="#ef8297" stroke-width="2"/>
  <text x="755.0" y="907" text-anchor="middle" font-family="Comic Mono, monospace" font-size="14" font-weight="700" fill="#ef8297">Rose = invalid input</text>
</g>

<g class="label-pill">
  <rect x="874" y="884" width="232" height="34" rx="17" fill="#07111f" stroke="#e7b85c" stroke-width="2"/>
  <text x="990.0" y="907" text-anchor="middle" font-family="Comic Mono, monospace" font-size="14" font-weight="700" fill="#e7b85c">Amber = size violation</text>
</g>


  <text x="1520" y="980" text-anchor="end" font-family="Comic Mono, monospace" font-size="15" font-weight="400" fill="#7892aa">bluetape4k-text 0.2.1</text>
</svg>
